<title>Fonte — Suivi musculation</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#141416;
    --surface:#1c1d20;
    --surface-2:#232428;
    --border:#2c2e33;
    --chalk:#f2efe9;
    --dim:#9a9ca3;
    --dim-2:#6b6d73;
    --accent:#e5482c;
    --accent-dim:#3a1f19;
    --success:#3aa15c;
    --success-dim: rgba(58,161,92,0.14);
    --cat-echauffement:#e8b923;
    --cat-musculation:#e5482c;
    --cat-calisthenie:#3f7fe3;
    --cat-cardio:#3aa15c;
    --cat-etirements:#2fb8a6;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f4f0;
    --surface:#ffffff;
    --surface-2:#efebe4;
    --border:#e1dbd0;
    --chalk:#211f1c;
    --dim:#726c62;
    --dim-2:#a29a8c;
    --accent:#e5482c;
    --accent-dim:#fbe0d9;
    --success:#2f8f52;
    --success-dim: rgba(47,143,82,0.12);
  }
  body{ transition: background-color .2s ease, color .2s ease; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior-y: none;
  }
  #app{ display:flex; flex-direction:column; min-height:100vh; }
  .num{ font-variant-numeric: tabular-nums; font-weight:800; letter-spacing:-0.02em; }

  .topbar{
    padding: calc(14px + var(--safe-t)) 20px 12px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky; top:0; z-index:10;
  }
  .topbar .brand{ font-size:22px; font-weight:800; letter-spacing:0.02em; text-transform:uppercase; }
  .topbar .brand span{ color:var(--accent); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .theme-toggle{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--dim); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle:active{ background:var(--accent-dim); color:var(--accent); }

  main{ flex:1; overflow-y:auto; padding: 16px 16px calc(96px + var(--safe-b)); }
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim-2);
    margin: 18px 4px 10px; font-weight:700; display:flex; align-items:center; gap:7px;
  }
  .section-title:first-child{ margin-top:4px; }
  .cat-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; transition: border-color .15s ease; }
  .exercise-card.goal-met{ border-color:var(--success); }

  .exercise-card .ex-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px; }
  .exercise-card .ex-title{ font-size:16px; font-weight:700; }
  .chevron{ color:var(--dim-2); transition: transform .2s ease; font-size:14px; flex-shrink:0; }
  .exercise-card.open .chevron{ transform: rotate(90deg); }

  .ex-head-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .link-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    width:44px; height:44px; font-size:16px; line-height:1; color:var(--dim);
  }
  .link-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .superset-badge{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700;
    margin-top:8px; background:var(--surface-2);
  }
  .superset-badge a{ font-weight:600; text-decoration:underline; opacity:0.85; }
  .link-hint{
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--chalk);
    border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px;
  }
  .link-hint a{ color:var(--accent); font-weight:700; }

  .objectif-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:13px; color:var(--dim); margin:10px 0 8px;
  }
  .objectif-row .obj-label{ color:var(--dim-2); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; margin-right:2px; }
  .obj-input{

<div class="pr-toast" id="prToast">Nouveau record</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "fonte_v4";
  var CAT_VAR = {
    "Échauffement":"--cat-echauffement",
    "Musculation":"--cat-musculation",
    "Calisthénie":"--cat-calisthenie",
    "Cardio":"--cat-cardio",
    "Étirements":"--cat-etirements"
  };
  var CAT_ORDER = ["Échauffement","Musculation","Calisthénie","Cardio","Étirements"];

  var DAYS = [
    {id:"lundi", label:"Lundi"},
    {id:"mardi", label:"Mardi"},
    {id:"mercredi", label:"Mercredi"},
    {id:"jeudi", label:"Jeudi"},
    {id:"vendredi", label:"Vendredi"}
  ];
  function dayLabel(id){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].id===id) return DAYS[i].label; return id; }
  function currentWeekdayId(){
    var jsDay = new Date().getDay(); // 0=dimanche..6=samedi
    var map = ["lundi","lundi","mardi","mercredi","jeudi","vendredi","vendredi"];
    return map[jsDay];
  }

  /* ---------- Exercise library ---------- */
  var RAW_EXERCISES = [
    ["Rotations d'épaules","Échauffement","Épaules"],
    ["Cercles de bras","Échauffement","Épaules"],
    ["Rotations de hanches","Échauffement","Jambes"],
    ["Montées de genoux","Échauffement","Cardio"],
    ["Talons-fesses","Échauffement","Cardio"],
    ["Jumping jacks","Échauffement","Cardio"],
    ["Squats sans charge","Échauffement","Jambes"],
    ["Gainage dynamique","Échauffement","Abdominaux"],
    ["Développé couché","Musculation","Pectoraux"],
    ["Développé incliné haltères","Musculation","Pectoraux"],
    ["Développé militaire","Musculation","Épaules"],
    ["Développé Arnold","Musculation","Épaules"],
    ["Squat barre","Musculation","Jambes"],
    ["Squat avant","Musculation","Jambes"],
    ["Presse à cuisses","Musculation","Jambes"],
    ["Soulevé de terre","Musculation","Dos"],
    ["Soulevé de terre roumain","Musculation","Dos"],
    ["Hip thrust","Musculation","Fessiers"],
    ["Rowing barre","Musculation","Dos"],
    ["Rowing haltère","Musculation","Dos"],
    ["Tirage horizontal poulie","Musculation","Dos"],
    ["Tirage vertical poulie","Musculation","Dos"],
    ["Fentes haltères","Musculation","Jambes"],
    ["Extension jambes","Musculation","Jambes"],
    ["Leg curl allongé","Musculation","Jambes"],
    ["Curl biceps barre","Musculation","Bras"],
    ["Curl biceps haltères","Musculation","Bras"],
    ["Curl marteau","Musculation","Bras"],
    ["Extension triceps poulie","Musculation","Bras"],
    ["Extension triceps nuque","Musculation","Bras"],
    ["Élévations latérales","Musculation","Épaules"],
    ["Élévations frontales","Musculation","Épaules"],
    ["Oiseau (élévations arrière)","Musculation","Épaules"],
    ["Shrugs","Musculation","Dos"],
    ["Face pull","Musculation","Épaules"],
    ["Mollets debout","Musculation","Mollets"],
    ["Mollets assis","Musculation","Mollets"],
    ["Farmer walk","Musculation","Dos"],
    ["Pompes","Calisthénie","Pectoraux"],
    ["Pompes diamant","Calisthénie","Pectoraux"],
    ["Pompes déclinées","Calisthénie","Pectoraux"],
    ["Tractions pronation","Calisthénie","Dos"],
    ["Tractions supination","Calisthénie","Dos"],
    ["Dips","Calisthénie","Pectoraux"],
    ["Squat au poids du corps","Calisthénie","Jambes"],
    ["Pistol squat","Calisthénie","Jambes"],
    ["Fentes sautées","Calisthénie","Jambes"],
    ["Gainage (planche)","Calisthénie","Abdominaux"],
    ["Gainage latéral","Calisthénie","Abdominaux"],
    ["Relevés de jambes suspendu","Calisthénie","Abdominaux"],
    ["Muscle-up","Calisthénie","Dos"],
    ["Handstand push-up","Calisthénie","Épaules"],
    ["L-sit","Calisthénie","Abdominaux"],
    ["Course à pied","Cardio","Cardio"],
    ["Corde à sauter","Cardio","Cardio"],
    ["Vélo","Cardio","Cardio"],
    ["Rameur","Cardio","Cardio"],
    ["Burpees","Cardio","Cardio"],
    ["Mountain climbers","Cardio","Cardio"],
    ["Step-up","Cardio","Jambes"],
    ["Battle rope","Cardio","Cardio"],
    ["Étirement ischio-jambiers","Étirements","Jambes"],
    ["Étirement quadriceps","Étirements","Jambes"],
    ["Étirement mollets","Étirements","Mollets"],
    ["Étirement épaules","Étirements","Épaules"],
    ["Étirement dos (chat-vache)","Étirements","Dos"],
    ["Étirement pectoraux","Étirements","Pectoraux"],
    ["Étirement fessiers (pigeon)","Étirements","Fessiers"],
    ["Étirement hanches (fente)","Étirements","Jambes"],
    ["Étirement poignets","Étirements","Bras"],
    ["Étirement cou","Étirements","Dos"]
  ];
  var MUSCLE_ORDER = ["Pectoraux","Dos","Épaules","Bras","Jambes","Fessiers","Abdominaux","Mollets","Cardio"];
  var DEFAULT_EXERCISES = RAW_EXERCISES.map(function(r,i){
    return {id:"d"+i, name:r[0], cat:r[1], muscle:r[2]};
  });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var ESC_MAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
  function esc(s){
    return String(s===null||s===undefined ? "" : s).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; });
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {
      exercises: DEFAULT_EXERCISES,
      days: DAYS.map(function(d){ return {id:d.id, sessions:[]}; }),
      history: []
    };
  }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    }catch(e){
      showToast("Sauvegarde impossible — stockage plein ou indisponible", true);
      return false;
    }
  }
  function exportData(){
    var json = JSON.stringify(state, null, 2);
    var stamp = new Date().toISOString().slice(0,10);
    var filename = "fonte-sauvegarde-"+stamp+".json";
    var file = new File([json], filename, {type:"application/json"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:filename}).catch(function(){});
    } else {
      var url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }
  }

  var state = load();
  var ui = { tab:"seance", activeDay:null, activeSession:null, newSessionForm:false, openExercise:null, historyDetail:null, draft:{}, exerciseQuery:"", linkFrom:null };

  var DEFAULT_TARGET = {sets:3, reps:8, weight:20};
  var DEFAULT_TARGET_CARDIO = {duration:20, speed:10, distance:3};

  function isCardio(ex){ return ex && ex.cat === "Cardio"; }
  function getExercise(id){ for(var i=0;i<state.exercises.length;i++) if(state.exercises[i].id===id) return state.exercises[i]; return null; }
  function getDay(id){ for(var i=0;i<state.days.length;i++) if(state.days[i].id===id) return state.days[i]; return null; }
  function findSession(sessionId){
    for(var i=0;i<state.days.length;i++){
      var day = state.days[i];
      for(var j=0;j<day.sessions.length;j++){
        if(day.sessions[j].id===sessionId) return {day:day, session:day.sessions[j]};
      }
    }
    return null;
  }
  function entryFor(session, exId){ for(var i=0;i<session.entries.length;i++) if(session.entries[i].exerciseId===exId) return session.entries[i]; return null; }
  function makeEntry(exId){
    var ex = getExercise(exId);
    var target;
    if(isCardio(ex)){
      target = ex.lastTarget ? {duration:ex.lastTarget.duration, speed:ex.lastTarget.speed, distance:ex.lastTarget.distance} : {duration:DEFAULT_TARGET_CARDIO.duration, speed:DEFAULT_TARGET_CARDIO.speed, distance:DEFAULT_TARGET_CARDIO.distance};
    } else {
      target = ex.lastTarget ? {sets:ex.lastTarget.sets, reps:ex.lastTarget.reps, weight:ex.lastTarget.weight} : {sets:DEFAULT_TARGET.sets, reps:DEFAULT_TARGET.reps, weight:DEFAULT_TARGET.weight};
    }
    return {exerciseId:exId, target:target, sets:[]};
  }
  function createSessionInDay(dayId, name){
    var day = getDay(dayId);
    var s = {id:uid(), name:name||"", entries:[]};
    day.sessions.push(s);
    save();
    return s;
  }
  function quickAddExercise(exId){
    var sessionId = ui.activeSession;
    if(!sessionId || !findSession(sessionId)){
      var dayId = ui.activeDay && getDay(ui.activeDay) ? ui.activeDay : currentWeekdayId();
      var day = getDay(dayId);
      var s = day.sessions.length ? day.sessions[day.sessions.length-1] : createSessionInDay(dayId, "");
      sessionId = s.id;
    }
    addExerciseToSession(sessionId, exId);
  }
  function addExerciseToSession(sessionId, exId){
    var loc = findSession(sessionId);
    if(!loc) return;
    if(!entryFor(loc.session, exId)) loc.session.entries.push(makeEntry(exId));
    save();
    ui.tab = "seance"; ui.activeDay = loc.day.id; ui.activeSession = sessionId; ui.openExercise = exId;
    render();
  }
  function bestAllTime(exId){
    var ex = getExercise(exId);
    var cardio = isCardio(ex);
    var best = 0;
    state.history.forEach(function(h){
      if(h.exerciseId!==exId) return;
      var v = cardio ? h.distance : h.weight;
      if(v>best) best = v;
    });
    return best;
  }
  function draftFor(exId){
    if(!ui.draft[exId]){
      var ex = getExercise(exId);
      if(isCardio(ex)){
        ui.draft[exId] = { duration: ex.lastDuration || 20, speed: ex.lastSpeed || 10, distance: ex.lastDistance || 3 };
      } else {
        ui.draft[exId] = { weight: ex.lastWeight || 20, reps: ex.lastReps || 8 };
      }
    }
    return ui.draft[exId];
  }
  var lastAddSetTs = 0;
  function addSet(sessionId, exId){
    var now = Date.now();
    if(now - lastAddSetTs < 500) return;
    lastAddSetTs = now;
    var loc = findSession(sessionId);
    if(!loc) return;
    var session = loc.session;
    var e = entryFor(session, exId);
    if(!e){ e = makeEntry(exId); session.entries.push(e); }
    var d = draftFor(exId);
    var ex = getExercise(exId);
    var prevBest = bestAllTime(exId);
    var setId = uid();
    if(isCardio(ex)){
      var isPRc = d.distance > prevBest;
      e.sets.push({id:setId, duration:d.duration, speed:d.speed, distance:d.distance, pr:isPRc});
      state.history.push({id:uid(), setId:setId, ts:Date.now(), dayId:loc.day.id, exerciseId:exId, duration:d.duration, speed:d.speed, distance:d.distance});
      ex.lastDuration = d.duration; ex.lastSpeed = d.speed; ex.lastDistance = d.distance;
      save(); render();
      if(isPRc) showPR();
    } else {
      var isPR = d.weight > prevBest;
      e.sets.push({id:setId, weight:d.weight, reps:d.reps, pr:isPR});
      state.history.push({id:uid(), setId:setId, ts:Date.now(), dayId:loc.day.id, exerciseId:exId, weight:d.weight, reps:d.reps});
      ex.lastWeight = d.weight; ex.lastReps = d.reps;
      save(); render();
      if(isPR) showPR();
    }
  }
  function deleteSet(sessionId, exId, setId){
    var loc = findSession(sessionId);
    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    e.sets = e.sets.filter(function(st){ return st.id!==setId; });
    state.history = state.history.filter(function(h){ return h.setId!==setId; });
    save(); render();
  }
  function setTarget(sessionId, exId, prop, value){
    var loc = findSession(sessionId);
    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    var ex = getExercise(exId);
    if(isCardio(ex)){
      if(!e.target) e.target = {duration:DEFAULT_TARGET_CARDIO.duration, speed:DEFAULT_TARGET_CARDIO.speed, distance:DEFAULT_TARGET_CARDIO.distance};
      e.target[prop] = value;
      ex.lastTarget = {duration:e.target.duration, speed:e.target.speed, distance:e.target.distance};
    } else {
      if(!e.target) e.target = {sets:DEFAULT_TARGET.sets, reps:DEFAULT_TARGET.reps, weight:DEFAULT_TARGET.weight};
      e.target[prop] = value;
      ex.lastTarget = {sets:e.target.sets, reps:e.target.reps, weight:e.target.weight};
    }
    save(); render();
  }
  function resetSession(sessionId){
    var loc = findSession(sessionId);
    if(!loc) return;
    if(!window.confirm("Réinitialiser toutes les séries de cette séance ?")) return;
    loc.session.entries.forEach(function(e){ e.sets = []; });
    save(); render();
  }
  function setSessionName(sessionId, name){
    var loc = findSession(sessionId);
    if(!loc) return;
    loc.session.name = name;
    save(); render();
  }
  function deleteSession(sessionId){
    var loc = findSession(sessionId);
    if(!loc) return;
    if(!window.confirm("Supprimer cette séance et toutes ses séries ?")) return;
    loc.day.sessions = loc.day.sessions.filter(function(s){ return s.id!==sessionId; });

  function showToast(msg, isError){
    var t = document.getElementById("prToast");
    t.textContent = msg;
    t.classList.toggle("error", !!isError);
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, isError ? 3000 : 1400);

  function stepBtn(delta,target,prop,label,ariaLabel){ return '<button data-action="step" data-target="'+target+'" data-prop="'+prop+'" data-delta="'+delta+'" aria-label="'+esc(ariaLabel||label)+'">'+label+'</button>'; }
  function catDot(cat){ return '<span class="cat-dot" style="background:var('+CAT_VAR[cat]+')"></span>'; }

  var SUPERSET_COLORS = ["--cat-musculation","--cat-calisthenie","--cat-cardio","--cat-etirements","--cat-echauffement"];
  function supersetColor(gid){
    var h = 0;
    for(var i=0;i<gid.length;i++) h = (h*31 + gid.charCodeAt(i)) % SUPERSET_COLORS.length;
    return "var("+SUPERSET_COLORS[h]+")";
  }
  function toggleLink(sessionId, exId){
    if(ui.linkFrom && ui.linkFrom.session===sessionId && ui.linkFrom.ex===exId){
      ui.linkFrom = null; render(); return;
    }
    if(!ui.linkFrom || ui.linkFrom.session!==sessionId){
      // Nothing pending, or the pending link was started in a different session
      // (e.g. user navigated away without cancelling) — a superset can only link
      // exercises within the same session, so start a fresh selection here.
      ui.linkFrom = {session:sessionId, ex:exId};
      render(); return;
    }
    var loc1 = findSession(ui.linkFrom.session);
    if(!loc1){ ui.linkFrom = null; render(); return; }
    var e1 = entryFor(loc1.session, ui.linkFrom.ex);
    var e2 = entryFor(loc1.session, exId);
    if(!e1 || !e2){ ui.linkFrom = null; render(); return; }
    var gid = e1.supersetId || e2.supersetId || uid();
    e1.supersetId = gid; e2.supersetId = gid;
    ui.linkFrom = null;
    save(); render();
  }
  function unlinkSuperset(sessionId, exId){
    var loc = findSession(sessionId);
    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    e.supersetId = null;
    save(); render();
  }

  function renderExerciseCard(session, exId){
    var ex = getExercise(exId);
    var cardio = isCardio(ex);
    var e = entryFor(session, exId);
    if(!e){ e = makeEntry(exId); session.entries.push(e); }
    if(!e.target){ e.target = cardio ? {duration:DEFAULT_TARGET_CARDIO.duration, speed:DEFAULT_TARGET_CARDIO.speed, distance:DEFAULT_TARGET_CARDIO.distance} : {sets:DEFAULT_TARGET.sets, reps:DEFAULT_TARGET.reps, weight:DEFAULT_TARGET.weight}; }
    var target = e.target;
    var sets = e.sets;
    var open = ui.openExercise === exId;
    var d = draftFor(exId);

    var metGoal, chips;
    if(cardio){
      metGoal = sets.some(function(st){ return st.distance >= target.distance && st.speed >= target.speed; });
      chips = sets.map(function(st){
        return '<span class="set-chip'+(st.pr?' pr':'')+'">'+st.distance+'km · '+st.speed+'km/h · '+st.duration+'min'+
          '<span class="del" data-action="delset" data-session="'+session.id+'" data-ex="'+exId+'" data-set="'+st.id+'" role="button" tabindex="0" aria-label="Supprimer cette série">✕</span></span>';
      }).join("");
    } else {
      var doneCount = sets.filter(function(st){ return st.weight >= target.weight && st.reps >= target.reps; }).length;
      metGoal = target.sets > 0 && doneCount >= target.sets;
      chips = sets.map(function(st){
        return '<span class="set-chip'+(st.pr?' pr':'')+'">'+st.weight+'kg × '+st.reps+
          '<span class="del" data-action="delset" data-session="'+session.id+'" data-ex="'+exId+'" data-set="'+st.id+'" role="button" tabindex="0" aria-label="Supprimer cette série">✕</span></span>';
      }).join("");
    }

    var html = '<div class="card exercise-card'+(open?' open':'')+(metGoal?' goal-met':'')+'">';
    html += '<div class="ex-head" data-action="toggle" data-ex="'+exId+'">';
    var linking = ui.linkFrom && ui.linkFrom.session===session.id && ui.linkFrom.ex===exId;
    html += '<span class="ex-title">'+esc(ex.name)+'</span>'+
      '<span class="ex-head-right">'+
      '<button class="link-btn'+(linking?' active':'')+'" data-action="linktoggle" data-session="'+session.id+'" data-ex="'+exId+'" aria-label="Lier en superset">🔗</button>'+
      '<span class="chevron" aria-hidden="true">▶</span></span></div>';
    if(e.supersetId){
      var sc = supersetColor(e.supersetId);
      html += '<div class="superset-badge" style="border-color:'+sc+';color:'+sc+'"><span>⚡ Superset</span>'+
        '<a data-action="unlink" data-session="'+session.id+'" data-ex="'+exId+'">Délier</a></div>';
    }

    if(cardio){
      html += '<div class="objectif-row"><span class="obj-label">Objectif</span>'+
        '<input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-duration" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.duration+'" aria-label="Objectif de durée en minutes"> min ×'+
        '<input class="obj-input" type="number" inputmode="decimal" min="0" data-role="target-speed" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.speed+'" aria-label="Objectif de vitesse en km/h"> km/h ×'+
        '<input class="obj-input" type="number" inputmode="decimal" min="0" data-role="target-distance" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.distance+'" aria-label="Objectif de distance en km"> km</div>';
    } else {
      html += '<div class="objectif-row"><span class="obj-label">Objectif</span>'+
        '<input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-sets" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.sets+'" aria-label="Objectif de nombre de séries"> séries ×'+
        '<input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-reps" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.reps+'" aria-label="Objectif de nombre de répétitions"> reps ×'+
        '<input class="obj-input" type="number" inputmode="decimal" min="0" data-role="target-weight" data-session="'+session.id+'" data-ex="'+exId+'" value="'+target.weight+'" aria-label="Objectif de poids en kg"> kg</div>';
    }

    html += '<div class="result-row'+(metGoal?' met':'')+'">';
    html += sets.length ? chips : '<span class="result-empty">Aucune série validée</span>';
    if(metGoal) html += '<span class="goal-badge">✓ Objectif atteint</span>';
    html += '</div>';

    if(open){
      html += '<div class="log-panel">';
      if(cardio){
        html += '<div class="stepper-row"><span class="stepper-label">Durée (min)</span><div class="stepper">'+
          stepBtn(-5,exId,"duration","−","Diminuer la durée de 5 minutes")+
          '<input class="num" type="number" inputmode="numeric" data-action="setval" data-target="'+exId+'" data-prop="duration" value="'+d.duration+'">'+
          stepBtn(5,exId,"duration","+","Augmenter la durée de 5 minutes")+'</div></div>';
        html += '<div class="stepper-row"><span class="stepper-label">Vitesse (km/h)</span><div class="stepper">'+
          stepBtn(-0.5,exId,"speed","−","Diminuer la vitesse de 0,5 km/h")+
          '<input class="num" type="number" inputmode="decimal" data-action="setval" data-target="'+exId+'" data-prop="speed" value="'+d.speed+'">'+
          stepBtn(0.5,exId,"speed","+","Augmenter la vitesse de 0,5 km/h")+'</div></div>';
        html += '<div class="stepper-row"><span class="stepper-label">Distance (km)</span><div class="stepper">'+
          stepBtn(-0.5,exId,"distance","−","Diminuer la distance de 0,5 km")+
          '<input class="num" type="number" inputmode="decimal" data-action="setval" data-target="'+exId+'" data-prop="distance" value="'+d.distance+'">'+
          stepBtn(0.5,exId,"distance","+","Augmenter la distance de 0,5 km")+'</div></div>';
      } else {
        html += '<div class="stepper-row"><span class="stepper-label">Poids (kg)</span><div class="stepper">'+
          stepBtn(-2.5,exId,"weight","−","Diminuer le poids de 2,5 kg")+
          '<input class="num" type="number" inputmode="decimal" data-action="setval" data-target="'+exId+'" data-prop="weight" value="'+d.weight+'">'+
          stepBtn(2.5,exId,"weight","+","Augmenter le poids de 2,5 kg")+'</div></div>';
        html += '<div class="stepper-row"><span class="stepper-label">Répétitions</span><div class="stepper">'+
          stepBtn(-1,exId,"reps","−","Diminuer le nombre de répétitions")+
          '<input class="num" type="number" inputmode="numeric" data-action="setval" data-target="'+exId+'" data-prop="reps" value="'+d.reps+'">'+
          stepBtn(1,exId,"reps","+","Augmenter le nombre de répétitions")+'</div></div>';
      }
      html += '<button class="validate-btn" data-action="addset" data-session="'+session.id+'" data-ex="'+exId+'">Valider</button>';
      html += '</div>';
    }
    html += '</div>';
    return html;

  function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

  function computeMuscleVolume(){
    var vol = {};
    MUSCLE_ORDER.forEach(function(m){ vol[m] = 0; });
    var since = Date.now() - 7*24*60*60*1000;
    state.history.forEach(function(h){
      if(h.ts < since) return;
      var ex = getExercise(h.exerciseId);
      if(!ex || !ex.muscle) return;
      if(vol[ex.muscle]===undefined) vol[ex.muscle] = 0;
      vol[ex.muscle] += 1;
    });
    return vol;
  }

  function renderMuscleVolume(){
    var vol = computeMuscleVolume();
    var max = 1;
    MUSCLE_ORDER.forEach(function(m){ if(vol[m]>max) max = vol[m]; });
    var html = '<div class="section-title">Suivi musculaire (7 derniers jours)</div><div class="card">';
    MUSCLE_ORDER.forEach(function(m){
      var v = vol[m]||0;
      var pct = Math.round((v/max)*100);
      html += '<div class="muscle-row">'+
        '<div class="muscle-label"><span>'+m+'</span><span class="num">'+v+' série'+(v>1?'s':'')+'</span></div>'+
        '<div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:'+pct+'%"></div></div>'+
        '</div>';
    });
    html += '</div>';
    return html;
  }

    state.history.forEach(function(h){ seen[h.exerciseId] = true; });

  function renderHistoryDetail(exId){
    var ex = getExercise(exId);
    var entries = state.history.filter(function(h){ return h.exerciseId===exId; }).slice().sort(function(a,b){ return a.ts-b.ts; });
    var byDate = {}, order = [];
    entries.forEach(function(h){
      var ds = new Date(h.ts).toISOString().slice(0,10);
      if(!byDate[ds]){ byDate[ds]=[]; order.push(ds); }
      byDate[ds].push(h);
    });
    var cardio = isCardio(ex);
    var points = order.map(function(ds){
      var arr = byDate[ds];
      var maxW = Math.max.apply(null, arr.map(function(x){return cardio ? x.distance : x.weight;}));
      return { dayId: arr[0].dayId, weight: maxW, sets: arr };
    });
    var html = '<a class="back-link" data-action="closedetail">‹ Historique</a>';
    html += '<div class="section-title">'+catDot(ex.cat)+esc(ex.name)+'</div>';
    html += '<div class="chart-wrap">'+lineChartSVG(points, cardio?"km":"kg")+'</div>';
    html += '<div class="card">';
    points.slice().reverse().forEach(function(p){
      var setsTxt = cardio
        ? p.sets.map(function(st){return st.distance+'km ('+st.speed+'km/h, '+st.duration+'min)';}).join(", ")
        : p.sets.map(function(st){return st.weight+'×'+st.reps;}).join(", ");
      html += '<div class="session-row"><span class="d">'+dayLabel(p.dayId)+'</span><span>'+setsTxt+'</span></div>';
    });
    html += '</div>';
    return html;
  }

  function lineChartSVG(points, unit){
    unit = unit || "kg";
    if(points.length===0) return '<div class="empty">Pas encore de données.</div>';
    if(points.length===1){
      return '<svg width="100%" height="90" viewBox="0 0 300 90"><circle cx="150" cy="45" r="5" fill="var(--accent)"/><text x="150" y="70" fill="var(--dim)" font-size="12" text-anchor="middle">'+points[0].weight+' '+unit+'</text></svg>';
    }
    var W=300,H2=90,pad=16;
    var ws = points.map(function(p){return p.weight;});
    var min = Math.min.apply(null, ws), max = Math.max.apply(null, ws);
    if(min===max){ min-=5; max+=5; }
    var stepX = (W-2*pad)/(points.length-1);
    var coords = points.map(function(p,i){
      var x = pad+i*stepX;
      var y = H2-pad-((p.weight-min)/(max-min))*(H2-2*pad);
      return [x,y];
    });
    var path = coords.map(function(c,i){ return (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1); }).join(" ");
    var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>'; }).join("");
    return '<svg width="100%" height="'+H2+'" viewBox="0 0 '+W+' '+H2+'"><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
  }

  function render(){

    else if(ui.tab==="exercices") view.innerHTML = renderExercices();

  document.getElementById("app").addEventListener("click", function(ev){
    var t = ev.target.closest("[data-action]");
    if(!t) return;
    var action = t.dataset.action;
    if(action==="toggle"){
      var exId = t.dataset.ex;
      ui.openExercise = (ui.openExercise===exId) ? null : exId;
      render();
    } else if(action==="addtoday"){
      quickAddExercise(t.dataset.ex);
    } else if(action==="goto-exercices"){
      ui.tab="exercices"; render();
    } else if(action==="openday"){
      ui.activeDay = t.dataset.id; ui.activeSession = null; ui.newSessionForm = false; ui.linkFrom = null; render();
    } else if(action==="closeday"){
      ui.activeDay = null; ui.linkFrom = null; render();
    } else if(action==="newsession"){
      ui.newSessionForm = true; render();
    } else if(action==="cancelnewsession"){
      ui.newSessionForm = false; render();
    } else if(action==="createsession"){
      var nameVal = document.getElementById("newSessName").value.trim();
      var s = createSessionInDay(t.dataset.day, nameVal);
      ui.newSessionForm = false; ui.activeSession = s.id;
      render();
    } else if(action==="opensession"){
      ui.activeSession = t.dataset.id; ui.openExercise = null; ui.linkFrom = null; render();
    } else if(action==="closesession"){
      ui.activeSession = null; ui.linkFrom = null; render();
    } else if(action==="resetsession"){
      resetSession(t.dataset.session);
    } else if(action==="deletesession"){
      deleteSession(t.dataset.session);
    } else if(action==="step"){
      var d = draftFor(t.dataset.target);
      var prop = t.dataset.prop, delta = parseFloat(t.dataset.delta);
      var zeroFloor = (prop==="weight"||prop==="speed"||prop==="distance");
      d[prop] = Math.max(zeroFloor?0:1, +(d[prop]+delta).toFixed(2));
      render();
    } else if(action==="addset"){
      addSet(t.dataset.session, t.dataset.ex);
    } else if(action==="delset"){
      deleteSet(t.dataset.session, t.dataset.ex, t.dataset.set);
    } else if(action==="linktoggle"){
      toggleLink(t.dataset.session, t.dataset.ex);
    } else if(action==="unlink"){
      unlinkSuperset(t.dataset.session, t.dataset.ex);
    } else if(action==="cancellink"){
      ui.linkFrom = null; render();
    } else if(action==="createex"){
      var nameInput = document.getElementById("newExName");
      var catInput = document.getElementById("newExCat");
      var muscleInput = document.getElementById("newExMuscle");
      var name = nameInput.value.trim();
      if(!name) return;
      state.exercises.push({id:uid(), name:name, cat:catInput.value, muscle:muscleInput.value});
      save(); render();
    } else if(action==="opendetail"){
      ui.historyDetail = t.dataset.ex; render();
    } else if(action==="closedetail"){
      ui.historyDetail = null; render();
    } else if(action==="exportdata"){
      exportData();
    } else if(action==="importdata"){
      document.getElementById("importFile").click();
    }
  });

  function validateImportedData(data){
    if(!data || typeof data!=="object") return false;
    if(!Array.isArray(data.exercises) || !Array.isArray(data.days)) return false;
    for(var i=0;i<data.exercises.length;i++){
      var ex = data.exercises[i];
      if(!ex || typeof ex.id!=="string" || typeof ex.name!=="string" || typeof ex.cat!=="string") return false;
    }
    for(var j=0;j<data.days.length;j++){
      var d = data.days[j];
      if(!d || typeof d.id!=="string" || !Array.isArray(d.sessions)) return false;
      for(var k=0;k<d.sessions.length;k++){
        var s = d.sessions[k];
        if(!s || typeof s.id!=="string" || !Array.isArray(s.entries)) return false;
      }
    }
    if(data.history!==undefined && !Array.isArray(data.history)) return false;
    return true;
  }

  document.getElementById("app").addEventListener("change", function(ev){
    var t = ev.target;
    if(t.id==="importFile" && t.files && t.files[0]){
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var data = JSON.parse(reader.result);
          if(!validateImportedData(data)){ window.alert("Fichier invalide ou de format inattendu."); return; }
          if(!window.confirm("Restaurer cette sauvegarde ? Les données actuelles seront remplacées.")) return;
          state = data;
          if(!state.history) state.history = [];
          save();
          ui.activeDay = null; ui.activeSession = null; ui.historyDetail = null;
          render();
        }catch(e){
          window.alert("Impossible de lire ce fichier.");
        }
      };
      reader.readAsText(t.files[0]);
    }
    if(t.dataset.action==="setval"){
      var d = draftFor(t.dataset.target);
      var v = parseFloat(t.value);
      if(isNaN(v)) v = 0;
      d[t.dataset.prop] = v;
      render();
    } else if(t.dataset.role==="sessionname"){
      setSessionName(t.dataset.session, t.value.trim());
    } else if(t.dataset.role && t.dataset.role.indexOf("target-")===0){
      var prop = t.dataset.role.replace("target-","");
      var v2 = parseFloat(t.value);
      if(isNaN(v2) || v2<0) v2 = 0;
      setTarget(t.dataset.session, t.dataset.ex, prop, v2);
    }
  });

  document.getElementById("app").addEventListener("input", function(ev){
    var t = ev.target;
    if(t.id==="exSearch"){
      ui.exerciseQuery = t.value;
      var pos = t.selectionStart;
      render();
      var el = document.getElementById("exSearch");
      if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
    }
  });

  var THEME_KEY = "fonte_theme";
  function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || "dark"; }catch(e){ return "dark"; } }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t==="light" ? "light" : "dark");
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t==="light" ? "#f7f4f0" : "#141416");
  }
  var currentTheme = loadTheme();
  applyTheme(currentTheme);
  document.getElementById("themeToggle").addEventListener("click", function(){
    currentTheme = currentTheme==="light" ? "dark" : "light";
    applyTheme(currentTheme);
    try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
  });
  document.getElementById("icloudBackupBtn").addEventListener("click", function(){
    exportData();
  });

  render();
})();
</script>
</body>
</html>
