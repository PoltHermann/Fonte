  // Carte d'un exercice d'ÉCHAUFFEMENT dans la séance (verte) : réglages du bloc, bouton bascule dans le menu ⋮.
  function renderWarmCard(session, e, ex){
    var exId = e.exerciseId, ek = e.id || exId, sid = session.id, cardio = isCardio(ex), t = e.target || {}, mode = entryMode(e);
    var idx = session.entries.indexOf(e), nW = warmCount(session);
    var menuOpen = ui.openMenu === ek;
    var base = ' data-session="'+sid+'" data-ex="'+ek+'"';
    var h = '<div class="card exercise-card warm">';
    h += '<div class="ex-head"><span class="ex-title"><span class="warm-tag" aria-hidden="true">🔥</span>'+esc(ex.name)+dupTag(session, e)+'</span>'+
      '<span class="ex-head-right"><button class="menu-btn'+(menuOpen?' active':'')+'" data-action="togglemenu" data-ex="'+ek+'" aria-label="Options de l’exercice">⋮</button></span></div>';
    if(menuOpen){
      h += '<div class="card-menu">'+
        (idx>0 ? '<button data-action="moveex"'+base+' data-dir="-1">↑ Monter</button>' : '')+
        (idx<nW-1 ? '<button data-action="moveex"'+base+' data-dir="1">↓ Descendre</button>' : '')+
        '<button data-action="togglewarm"'+base+'>↩ Repasser en exercice standard</button>'+
        '<button data-action="editexfromseance" data-ex="'+exId+'">'+ICON.edit+' Modifier l’exercice</button>'+
        '<button class="danger" data-action="removeex"'+base+'>'+ICON.trash+' Retirer de la séance</button>'+
        '</div>';
    }
    h += '<div class="warm-label">Échauffement</div>';
    if(cardio){
      h += '<div class="objectif-row"><span class="obj-label">Objectif</span>'+
        '<input class="obj-input" type="number" inputmode="decimal" min="0" data-role="target-duration"'+base+' value="'+(t.duration!==undefined?t.duration:5)+'" aria-label="Durée en minutes"> min ×'+
        '<input class="obj-input" type="number" inputmode="decimal" min="0" data-role="target-speed"'+base+' value="'+(t.speed!==undefined?t.speed:5)+'" aria-label="Vitesse en km/h"> km/h</div>';
    } else {
      h += '<div class="rest-line">Type : <select data-role="warmsessionmode"'+base+'>'+
        [['load','Poids + répétitions'],['reps','Répétitions seules'],['timed','Durée (compte à rebours)'],['done','Simple « fait »']].map(function(o){
          return '<option value="'+o[0]+'"'+(mode===o[0]?' selected':'')+'>'+o[1]+'</option>';
        }).join('')+'</select></div>';
      var setsIn = '<input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-sets"'+base+' value="'+(t.sets!==undefined?t.sets:2)+'" aria-label="Nombre de séries"> séries';
      if(mode==='timed'){
        h += '<div class="objectif-row">'+setsIn+' × <input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-seconds"'+base+' value="'+(t.seconds!==undefined?t.seconds:30)+'" aria-label="Durée en secondes"> sec</div>';
      } else if(mode==='done'){
        h += '<div class="objectif-row">'+setsIn+'</div>';
      } else {
        h += '<div class="objectif-row">'+setsIn+' × <input class="obj-input" type="number" inputmode="numeric" min="0" data-role="target-reps"'+base+' value="'+(t.reps!==undefined?t.reps:15)+'" aria-label="Nombre de répétitions"> reps</div>';
      }
    }
    h += '<div class="rest-line">⏱ repos <input class="rest-input-plain" type="number" inputmode="numeric" min="0" step="5" data-role="target-rest"'+base+' value="'+(t.rest!==undefined?t.rest:30)+'" aria-label="Temps de repos en secondes"> s</div>';
    var total = cardio ? 1 : (t.sets || 1);
    h += '<div class="warm-progress"><span>'+(e.sets.length>0 ? e.sets.length+' / '+total+' faite'+(e.sets.length>1?'s':'') : 'Pas encore fait')+'</span>'+
      '<button class="warm-done-btn" data-action="warmdone"'+base+'>✓ Fait</button></div>';
    h += '</div>';
    return h;
  }

  // `warm` : true = seulement l'échauffement, false = seulement la séance, absent = tout.
  function sessionTotalSets(session, warm){
    var total = 0;
    session.entries.forEach(function(e){
      if(warm!==undefined && isWarmEntry(e)!==!!warm) return;
      var ex = getExercise(e.exerciseId);
      if(!ex) return;
      total += isCardio(ex) ? 1 : ((e.target && e.target.sets) || 1);
    });
    return total;
  }
  // Deux jauges distinctes : celle de l'échauffement (verte) tant qu'on est dans le bloc, puis celle de la séance.
  function guidedProgressBarHTML(session){
    var warm = gW();
    var totalPlanned = sessionTotalSets(session, warm);
    var logged = warm ? ui.guided.warmLogged : ui.guided.setsLogged;
    var skipped = (warm ? ui.guided.warmSkipped : ui.guided.setsSkipped) || 0;
    var accounted = logged + skipped;
    var pct = totalPlanned>0 ? Math.round(Math.min(accounted, totalPlanned)/totalPlanned*100) : 0;
    return '<div class="guided-progress-wrap">'+
      '<div class="guided-progress-bar"><div class="guided-progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="guided-progress-label">'+logged+'/'+totalPlanned+(warm ? ' séries d\'échauffement' : ' séries de la séance')+(skipped>0 ? ' · '+skipped+' passée'+(skipped>1?'s':'') : '')+'</div>'+
      '</div>';
  }
  function targetSummary(ex, target){
    if(isCardio(ex)) return target.duration+'min × '+target.speed+'km/h × '+target.distance+'km';
    if(target.mode==="timed") return (target.sets>1 ? target.sets+' × ' : '')+(target.seconds||30)+' s';
    if(target.mode==="reps") return (target.sets||1)+' × '+(target.reps||10)+' reps';
    if(target.mode==="done") return (target.sets>1 ? target.sets+' × ' : '')+'à faire';
    if(isBodyweight(ex)) return target.sets+'×'+target.reps+' reps'+(target.weight>0 ? ' +'+target.weight+'kg' : '');
    return target.sets+'×'+target.reps+'×'+target.weight+'kg';
  }

  // Chrono total : calculé depuis l'horodatage de départ (juste même si l'écran s'est mis en veille
  // ou si l'app est passée en arrière-plan) ; il continue d'un bout à l'autre de l'enchaînement
  // échauffement → séance et se fige à l'écran de fin.
  function formatClock(sec){
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    return (h>0 ? h+":"+(m<10?"0":"")+m : m)+":"+(s<10?"0":"")+s;
  }
  function runElapsed(){
    if(!ui.guided || !ui.guided.runStartedAt) return 0;
    return ((ui.guided.runEndedAt || Date.now()) - ui.guided.runStartedAt)/1000;
  }
  function stopRunClock(){ clearInterval(runClockTimer); runClockTimer = null; }
  function tickRunClock(){
    if(!ui.guided || ui.guided.runEndedAt){ stopRunClock(); return; }
    var el = document.getElementById("runClock");
    if(el) el.textContent = formatClock(runElapsed());
  }
  function startRunClock(){
    clearInterval(runClockTimer);
    runClockTimer = setInterval(tickRunClock, 1000);
  }
  function guidedTopHTML(session){
    var warmTop = gW();
    return '<div class="g-top'+(warmTop?' warm':'')+'">'+
      '<div class="g-toprow"><span class="g-live"><i></i>'+(warmTop ? '🔥 Échauffement' : 'Séance en cours')+'</span>'+
      '<span class="g-clock" aria-label="Temps total de la séance">Total <b id="runClock">'+formatClock(runElapsed())+'</b></span></div>'+
      guidedProgressBarHTML(session)+
      '<button class="howto-btn" data-action="togglehowto">📋 Guide technique</button>'+
      '</div>';
  }
  function renderGuided(){
    var session = guidedSource();
    if(!session){ ui.guided=null; return renderSeance(); }
    var entries = session.entries;

    if(ui.guided.phase==="done" || ui.guided.entryIndex >= entries.length){
      if(!ui.guided.runEndedAt) ui.guided.runEndedAt = Date.now();
      stopRunClock();
      var mins = Math.max(1, Math.round(runElapsed()/60));
      var sum = sessionSummary(entries);
      var html2 = '<div class="guided-screen"><div class="g-mid guided-done">'+
        '<div class="guided-done-icon">✓</div>'+
        '<div class="guided-done-title">Séance terminée</div>'+
        '<div class="guided-done-sub">'+ui.guided.setsLogged+' série'+(ui.guided.setsLogged>1?'s':'')+' validée'+(ui.guided.setsLogged>1?'s':'')+' en '+mins+' min</div>'+
        '<div class="stat-row sum-stats">'+
          '<div class="stat"><div class="v">'+ui.guided.setsLogged+'</div><div class="l">Séries</div></div>'+
          '<div class="stat"><div class="v">'+(sum.totalKg>0 ? fmtNum(sum.totalKg)+' <small>kg</small>' : '—')+'</div><div class="l">Volume</div></div>'+
          '<div class="stat"><div class="v">'+(sum.records>0 ? '★ '+sum.records : '0')+'</div><div class="l">Record'+(sum.records>1?'s':'')+'</div></div>'+
        '</div>'+
        '<div class="guided-summary-list">'+(sum.rows.join('') || '<div class="hist-sub">Aucune série validée.</div>')+'</div></div>';
      html2 += '<div class="g-bottom"><button class="validate-btn" data-action="guidedexit">Terminer</button></div></div>';
      return html2;
    }

    var entry = entries[ui.guided.entryIndex];
    var ex = getExercise(entry.exerciseId);
    if(!ex){ ui.guided.entryIndex++; return renderGuided(); }
    var target = entry.target || {};
    var cardio = isCardio(ex);
    var warm = isWarmEntry(entry);
    var mode = warm ? entryMode(entry) : "load";
    var totalSets = cardio ? 1 : (target.sets||1);
    var canGoBack = ui.guided.entryIndex>0 || ui.guided.setNumber>1;

    var howToOverlay = "";
    if(ui.guided.showHowTo){
      howToOverlay = '<div class="howto-overlay" data-action="closehowto"><div class="howto-modal" data-action="noop">'+
        '<div class="howto-modal-title">'+esc(ex.name)+'</div>'+
        '<textarea class="howto-edit-area" placeholder="Comment faire cet exercice… (modifiable)" data-role="howto" data-ex="'+entry.exerciseId+'">'+esc(ex.howTo||"")+'</textarea>'+
        '<button class="cta-btn" data-action="closehowto">Fermer</button>'+
        '</div></div>';
    }

    var quitChoiceOverlay = "";
    if(ui.guided.showQuitChoice){
      quitChoiceOverlay = '<div class="howto-overlay" data-action="noop"><div class="howto-modal" data-action="noop">'+
        '<div class="howto-modal-title">Quitter l\'échauffement ?</div>'+
        '<button class="cta-btn" data-action="warmupquitskip">Passer à la séance</button>'+
        '<button class="guided-btn guided-btn-quit" style="width:100%;margin-top:10px;" data-action="warmupquitall">Abandonner complètement</button>'+
        '<button class="howto-btn" style="width:100%;margin-top:10px;" data-action="warmupquitcancel">Annuler</button>'+
        '</div></div>';
    }

    // Le bouton « Annuler » réserve toujours sa place : plus aucun décalage de « Valider ».
    var undoBtn = '<button class="g-undo'+(canGoBack?'':' ghost')+'" data-action="guidedgoback"'+(canGoBack?'':' tabindex="-1" aria-hidden="true" disabled')+'>'+ICON.undo+' Annuler la dernière série</button>';
    var noteHTML = warm ? '' :
      '<textarea class="note-area guided-note" rows="1" placeholder="Note sur '+esc(ex.name)+'…" data-role="note" data-session="'+session.id+'" data-ex="'+(entry.id||entry.exerciseId)+'">'+esc(entry.note||"")+'</textarea>';

    if(ui.guided.phase==="rest"){
      var remaining = (ui.guided.restEndsAt - Date.now())/1000;
      var nextTitle, nextSub;
      if(ui.guided.setNumber<=totalSets){
        nextTitle = esc(ex.name)+dupTag(session, entry);
        nextSub = (totalSets>1 ? 'Série '+ui.guided.setNumber+'/'+totalSets+' · ' : '')+targetSummary(ex, target);
      } else {
        var nextEntry = entries[ui.guided.entryIndex+1];
        var nextEx = nextEntry ? getExercise(nextEntry.exerciseId) : null;
        nextTitle = nextEx ? esc(nextEx.name)+dupTag(session, nextEntry) : 'Fin de séance';
        nextSub = (nextEx && nextEntry) ? targetSummary(nextEx, nextEntry.target||{}) : '';
      }
      return '<div class="guided-screen'+(warm?' warm':'')+'">'+
        guidedTopHTML(session)+
        '<div class="g-mid rest">'+
          '<div class="rest-label">Repos</div>'+
          '<div class="rest-countdown" id="restCountdown">'+formatTime(remaining)+'</div>'+
          '<div class="g-after">'+
            '<div class="g-next"><span class="n1">Ensuite</span><span class="n2">'+nextTitle+'</span>'+(nextSub?'<span class="n3">'+nextSub+'</span>':'')+'</div>'+
            undoBtn+
          '</div>'+
        '</div>'+
        '<div class="g-bottom">'+noteHTML+
          '<div class="guided-btn-row">'+
          '<button class="guided-btn guided-btn-quit" data-action="guidedquitrequest">Quitter</button>'+
          '<button class="guided-btn guided-btn-skip" data-action="guidedskiprest">Passer le repos</button>'+
          '</div>'+
        '</div>'+
        '</div>'+howToOverlay+quitChoiceOverlay;
    }

    // Pré-remplissage : échauffement → valeurs de l'objectif ; exercice jamais fait → objectif.
    if(!cardio){
      if(warm){
        var seedKey = ui.guided.entryIndex+':'+ui.guided.setNumber;
        if(ui.guided.seededKey !== seedKey){
          ui.guided.seededKey = seedKey;
          ui.draft[entry.exerciseId] = {weight:(target.weight||0), reps:(target.reps||0)};
        }
      }
    }
    var d = draftFor(entry.exerciseId);
    var flash = !!ui.guided.justFinishedRest;
    ui.guided.justFinishedRest = false;
    var seconds = target.seconds || 30;
    var timedRunning = (mode==="timed") && !!ui.guided.timedEndsAt;
    var hint;
    if(cardio) hint = 'Objectif : '+target.duration+' min × '+target.speed+' km/h × '+target.distance+' km';
    else if(mode==="timed") hint = 'Objectif : '+seconds+' s';
    else if(mode==="reps") hint = 'Objectif : '+(target.reps||0)+' répétitions';
    else if(mode==="done") hint = 'À faire une fois';
    else if(isBodyweight(ex)) hint = 'Objectif : '+target.sets+' × '+target.reps+' reps'+(target.weight>0 ? ' + '+target.weight+' kg' : '');
    else hint = 'Objectif : '+target.sets+' × '+target.reps+' × '+target.weight+' kg';

    var html = '<div class="guided-screen'+(warm?' warm':'')+'">'+guidedTopHTML(session)+'<div class="g-mid'+(flash?' rest-flash':'')+'">';
    html += '<div class="guided-ex-name">'+esc(ex.name)+dupTag(session, entry)+'</div>';
    if(!warm || totalSets>1) html += '<div class="g-set">Série '+ui.guided.setNumber+' / '+totalSets+'</div>';
    html += '<div class="g-hint">'+hint+'</div>';
    if(mode==="timed"){
      html += '<div class="set-stopwatch-big timed'+(timedRunning?' running':'')+'" id="setStopwatch">'+formatTime(timedRunning ? Math.ceil(Math.max(0,(ui.guided.timedEndsAt-Date.now())/1000)) : seconds)+'</div>';
    } else if(mode!=="done"){
      html += '<div class="set-stopwatch-big" id="setStopwatch">'+formatTime((Date.now()-ui.guided.setStartedAt)/1000)+'</div>';
    }
    if(cardio){
      html += '<div class="stepper-row"><span class="stepper-label">Durée (min)</span><div class="stepper">'+
        stepBtn(-5,entry.exerciseId,"duration","−","Diminuer la durée")+
        '<input class="num" type="text" inputmode="numeric" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="duration" value="'+d.duration+'">'+
        stepBtn(5,entry.exerciseId,"duration","+","Augmenter la durée")+'</div></div>';
      html += '<div class="stepper-row"><span class="stepper-label">Vitesse (km/h)</span><div class="stepper">'+
        stepBtn(-0.5,entry.exerciseId,"speed","−","Diminuer la vitesse")+
        '<input class="num" type="text" inputmode="decimal" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="speed" value="'+d.speed+'">'+
        stepBtn(0.5,entry.exerciseId,"speed","+","Augmenter la vitesse")+'</div></div>';
      html += '<div class="stepper-row"><span class="stepper-label">Distance (km)</span><div class="stepper">'+
        stepBtn(-0.5,entry.exerciseId,"distance","−","Diminuer la distance")+
        '<input class="num" type="text" inputmode="decimal" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="distance" value="'+d.distance+'">'+
        stepBtn(0.5,entry.exerciseId,"distance","+","Augmenter la distance")+'</div></div>';
    } else {
      if(mode==="load" && (!isBodyweight(ex) || showBallast(ex, target, d))){
        html += '<div class="stepper-row"><span class="stepper-label">'+(isBodyweight(ex)?'Lest (kg)':'Poids (kg)')+'</span><div class="stepper">'+
          stepBtn(-1,entry.exerciseId,"weight","−","Diminuer le poids")+
          '<input class="num" type="text" inputmode="decimal" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="weight" value="'+d.weight+'">'+
          stepBtn(1,entry.exerciseId,"weight","+","Augmenter le poids")+'</div></div>';
      }
      if(mode==="load" || mode==="reps"){
        html += '<div class="stepper-row"><span class="stepper-label">Répétitions</span><div class="stepper">'+
          stepBtn(-1,entry.exerciseId,"reps","−","Diminuer les répétitions")+
          '<input class="num" type="text" inputmode="numeric" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="reps" value="'+d.reps+'">'+
          stepBtn(1,entry.exerciseId,"reps","+","Augmenter les répétitions")+'</div></div>';
      }
    }
    if(!cardio && mode==="load" && isBodyweight(ex) && !showBallast(ex, target, d)) html += '<button class="g-ballast" data-action="showballast" data-ex="'+entry.exerciseId+'">+ Ajouter un lest</button>';
    html += '</div>';

    var mainBtn;
    if(mode==="timed"){
      mainBtn = timedRunning
        ? '<button class="validate-btn" data-action="guidedvalidate">Terminer maintenant</button>'
        : '<button class="validate-btn" data-action="guidedstarttimer">▶ Démarrer ('+seconds+' s)</button>';
    } else if(mode==="done"){
      mainBtn = '<button class="validate-btn" data-action="guidedvalidate">Fait ✓</button>';
    } else {
      mainBtn = '<button class="validate-btn" data-action="guidedvalidate">Valider la série</button>';
    }
    html += '<div class="g-bottom">'+noteHTML+mainBtn+undoBtn+
      '<div class="guided-btn-row">'+
      '<button class="guided-btn guided-btn-quit" data-action="guidedquitrequest">Quitter</button>'+
      '<button class="guided-btn guided-btn-skip" data-action="guidedskipexercise">Passer cet exercice</button>'+
      '</div></div>';
    html += '</div>';
    html += howToOverlay;
    html += quitChoiceOverlay;
    return html;
  }

  function renderSeance(){
    if(ui.activeSession){
      var loc = findSession(ui.activeSession);
      if(loc) return renderSessionDetail(loc.day, loc.session);
      ui.activeSession = null;
    }
    if(ui.activeDay && getDay(ui.activeDay)) return renderDaySessions(ui.activeDay);
    ui.activeDay = null;
    return renderDayList();
  }

  function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

  function renderExercices(){
    var q = norm(ui.exerciseQuery || "");
    var byCat = {}, order = [];
    state.exercises.forEach(function(ex){
      if(q && norm(ex.name).indexOf(q)===-1) return;
      if(!byCat[ex.cat]){ byCat[ex.cat]=[]; order.push(ex.cat); }
      byCat[ex.cat].push(ex);
    });
    var html = "";
    if(ui.exercisePickerFor && ui.exercisePickerFor.type==="warmup"){
      var pickerWarmup = findWarmup(ui.exercisePickerFor.id);
      html += '<div class="picker-banner">Ajout à l\'échauffement « '+esc(pickerWarmup?pickerWarmup.name:"")+' » <a data-action="backtowarmupedit" data-warmup="'+ui.exercisePickerFor.id+'">← Retour</a></div>';
    }
    html += '<div class="search-wrap"><input id="exSearch" type="text" inputmode="search" autocomplete="off" placeholder="Rechercher un exercice…" value="'+esc(ui.exerciseQuery||'')+'"></div>';
    if(order.length===0){
      html += '<div class="empty">Aucun exercice ne correspond à « '+esc(ui.exerciseQuery||'')+' ».</div>';
    }
    order.forEach(function(cat){
      html += '<div class="section-title">'+catDot(cat)+cat+'</div><div class="card">';
      byCat[cat].forEach(function(ex){
        if(ui.editingExercise===ex.id){
          html += '<div class="edit-ex-form">'+
            '<input type="text" id="editExName" value="'+esc(ex.name)+'">'+
            '<select id="editExCat">'+CAT_ORDER.map(function(c){return '<option'+(c===ex.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
            '<select id="editExMuscle">'+MUSCLE_ORDER.map(function(m){return '<option'+(m===ex.muscle?' selected':'')+'>'+m+'</option>';}).join('')+'</select>'+
            (ex.cat==="Cardio" ? '' :
              '<label class="chk-row"><input type="checkbox" id="editExBodyweight"'+(isBodyweight(ex)?' checked':'')+'> Poids du corps (lest optionnel)</label>'+
              '<label class="chk-row"><input type="checkbox" id="editExPerHand"'+(ex.perHand===true?' checked':'')+'> Haltères : poids par main (volume compté ×2)</label>')+
            '<textarea class="note-area" id="editExHowTo" placeholder="Comment faire cet exercice…">'+esc(ex.howTo||"")+'</textarea>'+
            '<div class="btn-row"><button class="cancel" data-action="canceleditex">Annuler</button><button class="create" data-action="saveeditex" data-ex="'+ex.id+'">Enregistrer</button></div>'+
            '<a class="danger-link" data-action="deleteex" data-ex="'+ex.id+'">'+ICON.trash+' Supprimer cet exercice de la bibliothèque</a>'+
            '</div>';
        } else {
          html += '<div class="ex-row"><span class="name">'+esc(ex.name)+'</span>'+
            '<span class="ex-row-actions">'+
            '<button class="icon-btn-sm" data-action="editex" data-ex="'+ex.id+'" aria-label="Modifier '+esc(ex.name)+'">'+ICON.edit+'</button>'+
            '<button class="add-circle" data-action="addtoday" data-ex="'+ex.id+'" aria-label="Ajouter '+esc(ex.name)+' à la séance">+</button>'+
            '</span></div>';
        }
      });
      html += '</div>';
    });
    html += '<div class="section-title">Nouvel exercice</div>';
    html += '<div class="new-ex-form">'+
      '<input id="newExName" type="text" placeholder="Nom de l’exercice">'+
      '<select id="newExCat">'+CAT_ORDER.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select>'+
      '<select id="newExMuscle">'+MUSCLE_ORDER.map(function(m){return '<option>'+m+'</option>';}).join('')+'</select>'+
      '<button data-action="createex">Ajouter</button></div>';
    return html;
  }

  function computeMuscleVolume(){
    var vol = {};
    MUSCLE_ORDER.forEach(function(m){ vol[m] = 0; });
    var since = Date.now() - 7*24*60*60*1000;
    state.history.forEach(function(h){
      if(h.ts < since) return;
      var ex = getExercise(h.exerciseId);
      if(!ex || !ex.muscle) return;
      if(vol[ex.muscle]===undefined) vol[ex.muscle] = 0;
      vol[ex.muscle] += 1;
    });
    return vol;
  }

  function renderMuscleVolume(){
    var vol = computeMuscleVolume();
    var goals = state.settings.weeklyGoals || {};
    var max = 1;
    MUSCLE_ORDER.forEach(function(m){ if(vol[m]>max) max = vol[m]; });
    var html = '<div class="section-title">Suivi musculaire (7 derniers jours)</div><div class="card">';
    MUSCLE_ORDER.forEach(function(m){
      var v = vol[m]||0, g = goals[m]||0, pct, cls = "", label;
      if(g>0){

        '</div>';

  // ----- Historique : volume par séance -----
  function localDayKey(ts){
    var d = new Date(ts);
    return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  }
  function fmtNum(v){
    v = Math.round(v*10)/10;
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  function fmtAxis(v){
    if(v>=1000) return (Math.round(v/100)/10)+"k";
    return String(Math.round(v*10)/10);
  }
  function fmtShortDate(ts){
    var d = new Date(ts);
    return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);
  }
  function fmtLongDate(ts){
    var d = new Date(ts);
    var jours = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
    return jours[d.getDay()]+" "+fmtShortDate(ts);
  }
  // Une valeur par séance (= par jour) : volume = Σ poids×reps (musculation) ou Σ distance (cardio).
  function volumePoints(exId){
    var ex = getExercise(exId), cardio = isCardio(ex);
    var byDay = {}, order = [];
    state.history.forEach(function(h){
      if(h.exerciseId!==exId) return;
      var k = localDayKey(h.ts);
      if(!byDay[k]){ byDay[k] = {key:k, ts:h.ts, vol:0, max:0, sets:[]}; order.push(k); }
      var o = byDay[k];
      if(h.ts<o.ts) o.ts = h.ts;
      o.vol += setVolume(ex, h);
      var mv = cardio ? (h.distance||0) : (isBodyweight(ex) ? (h.reps||0) : (h.weight||0));
      if(mv>o.max) o.max = mv;
      o.sets.push(h);
    });
    return order.map(function(k){ return byDay[k]; }).sort(function(a,b){ return a.ts-b.ts; });
  }
  var PERIOD_DAYS = {"4w":28, "3m":91, "all":0};
  function filterPeriod(points, p){
    var days = PERIOD_DAYS[p];
    if(!days) return points;
    var cut = Date.now() - days*86400000;
    return points.filter(function(x){ return x.ts>=cut; });
  }
  function pctChange(a, b){
    if(!a) return null;
    return Math.round((b-a)/a*100);
  }
  function trendHTML(p){
    if(p===null || p===undefined) return '<span class="trend-flat">—</span>';
    if(p>0) return '<span class="trend-up">▲ +'+p+' %</span>';
    if(p<0) return '<span class="trend-down">▼ '+p+' %</span>';
    return '<span class="trend-flat">= 0 %</span>';
  }
  function niceStep(raw){
    if(!(raw>0)) return 1;
    var pow = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
    var n = raw/pow;
    var m = n<=1 ? 1 : n<=2 ? 2 : n<=2.5 ? 2.5 : n<=5 ? 5 : 10;
    return m*pow;
  }
  function compressSets(sets, cardio, ex){
    var sorted = sets.slice().sort(function(a,b){ return a.ts-b.ts; });
    var groups = [];
    sorted.forEach(function(st){
      var key = cardio ? (st.distance+"|"+st.speed+"|"+st.duration) : (st.weight+"|"+st.reps);
      var last = groups[groups.length-1];
      if(last && last.key===key) last.n++;
      else groups.push({key:key, n:1, st:st});
    });
    return groups.map(function(g){
      var base = cardio ? (g.st.distance+' km · '+g.st.speed+' km/h · '+g.st.duration+' min') : ((ex && isBodyweight(ex)) ? ((g.st.weight>0 ? '+'+g.st.weight+' kg × ' : '')+g.st.reps+' reps') : (g.st.weight+' kg × '+g.st.reps));
      return g.n>1 ? base+' — '+g.n+' séries' : base;
    }).join(' · ');
  }
  function volumeChartSVG(points, unit){
    if(points.length===0) return '<div class="empty">Aucune séance sur cette période.</div>';
    var W=340, H=200, pl=46, pr=18, pt=24, pb=30;
    var vals = points.map(function(p){ return p.vol; });
    var max = Math.max.apply(null, vals);
    if(!(max>0)) max = 1;
    var step = niceStep(max/4);
    var top = Math.ceil(max/step)*step;
    var n = points.length;
    var innerW = W-pl-pr, innerH = H-pt-pb;
    var t0 = points[0].ts, t1 = points[n-1].ts;
    // Axe X proportionnel au temps : deux séances espacées de 3 semaines sont 3× plus éloignées qu'à 1 semaine.
    function X(ts){ return (n===1 || t1===t0) ? pl+innerW/2 : pl + (ts-t0)/(t1-t0)*innerW; }
    function Y(v){ return pt + (1 - v/top)*innerH; }
    var svg = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Volume par séance">';
    for(var t=0; t<=top+step/2; t+=step){
      var y = Y(t).toFixed(1);
      svg += '<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" style="stroke:var(--border)" stroke-width="1"/>';
      svg += '<text x="'+(pl-7)+'" y="'+(parseFloat(y)+4)+'" text-anchor="end" font-size="11" style="fill:var(--dim)">'+fmtAxis(t)+'</text>';
    }
    var coords = points.map(function(p){ return [X(p.ts), Y(p.vol)]; });
    if(n>1){
      var area = 'M'+coords[0][0].toFixed(1)+','+Y(0).toFixed(1)+' '+coords.map(function(c2){ return 'L'+c2[0].toFixed(1)+','+c2[1].toFixed(1); }).join(' ')+' L'+coords[n-1][0].toFixed(1)+','+Y(0).toFixed(1)+' Z';
      svg += '<path d="'+area+'" style="fill:var(--accent)" fill-opacity="0.10"/>';
      svg += '<path d="'+coords.map(function(c2,i){ return (i===0?'M':'L')+c2[0].toFixed(1)+','+c2[1].toFixed(1); }).join(' ')+'" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    coords.forEach(function(c2){
      svg += '<circle cx="'+c2[0].toFixed(1)+'" cy="'+c2[1].toFixed(1)+'" r="4.5" style="fill:var(--accent)"/>';
    });
    // Valeurs : dernière, record, puis les autres — en sautant celles qui se chevauchent.
    var maxIdx = vals.indexOf(max);
    var prio = [n-1, maxIdx];
    for(var q=0; q<n; q++) if(prio.indexOf(q)===-1) prio.push(q);
    var placed = [];
    prio.forEach(function(i){
      if(n>8 && i!==n-1 && i!==maxIdx) return;
      var px = coords[i][0], py = coords[i][1];
      for(var k=0; k<placed.length; k++){
        if(Math.abs(placed[k][0]-px)<30 && Math.abs(placed[k][1]-py)<16) return;
      }
      placed.push([px,py]);
      var lx = Math.min(W-pr-8, Math.max(pl+8, px));
      svg += '<text x="'+lx.toFixed(1)+'" y="'+(py-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--chalk)">'+fmtAxis(vals[i])+'</text>';
    });
    // Dates : réparties dans le temps (pas par rang de séance).
    var ticks = (n===1 || t1===t0) ? 1 : 5;
    for(var j=0; j<ticks; j++){
      var ts = ticks===1 ? t0 : t0 + j*(t1-t0)/(ticks-1);
      svg += '<text x="'+X(ts).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" style="fill:var(--dim)">'+fmtShortDate(ts)+'</text>';
    }
    return svg + '</svg>';
  }
  // Tendance robuste : moyenne des dernières séances vs moyenne des premières, en ignorant
  // les séances partielles (moins de la moitié des séries habituelles).
  function robustTrend(points){
    if(points.length<2) return null;
    var counts = points.map(function(p){ return p.sets.length; }).sort(function(a,b){ return a-b; });
    var median = counts[Math.floor(counts.length/2)];
    var valid = points.filter(function(p){ return p.sets.length >= median*0.5; });
    if(valid.length<2) valid = points;
    var k = valid.length>=4 ? Math.min(3, Math.floor(valid.length/2)) : 1;
    function avg(arr){ return arr.reduce(function(a,p){ return a+p.vol; },0)/arr.length; }
    return pctChange(avg(valid.slice(0,k)), avg(valid.slice(valid.length-k)));
  }

  function renderHistoryDetail(exId){
    var ex = getExercise(exId);
    var cardio = isCardio(ex);
    var unit = unitOf(ex);
    var bw = isBodyweight(ex);
    var metric = cardio ? "vol" : (ui.histMetric==="max" ? "max" : "vol");
    var all = volumePoints(exId).map(function(p){ return Object.assign({}, p, {vol: metric==="max" ? p.max : p.vol}); });
    var period = ui.histPeriod || "3m";
    var pts = filterPeriod(all, period);
    var html = crumbs([{t:'Historique', a:'closedetail'}, {cur:ex.name}]);
    var subTxt;
    if(cardio) subTxt = 'Distance totale par séance';
    else if(bw) subTxt = metric==="max" ? 'Meilleure série (répétitions) par séance' : 'Répétitions totales par séance';
    else if(metric==="max") subTxt = 'Charge maximale utilisée par séance'+(ex.perHand===true ? ' (poids par main)' : '');
    else subTxt = 'Volume par séance (poids × répétitions, toutes séries)'+(volFactor(ex)===2 ? ' — haltères comptés ×2' : '');
    html += '<div class="hist-sub">'+subTxt+'</div>';
    if(!cardio){
      html += '<div class="seg" role="tablist" aria-label="Indicateur">'+
        [["vol", bw ? "Répétitions" : "Volume"], ["max", bw ? "Reps max" : "Charge max"]].map(function(m){
          return '<button class="'+(metric===m[0]?'on':'')+'" data-action="histmetric" data-m="'+m[0]+'">'+m[1]+'</button>';
        }).join('')+'</div>';
    }

    var last = all.length ? all[all.length-1] : null;
    var prev = all.length>1 ? all[all.length-2] : null;
    var vsPrev = (last && prev) ? pctChange(prev.vol, last.vol) : null;
    var vsPeriod = robustTrend(pts);
    html += '<div class="stat-row">'+
      '<div class="stat"><div class="v">'+(last ? fmtNum(last.vol)+' <small>'+unit+'</small>' : '—')+'</div><div class="l">Dernière séance</div></div>'+
      '<div class="stat"><div class="v">'+trendHTML(vsPrev)+'</div><div class="l">vs précédente</div></div>'+
      '<div class="stat"><div class="v">'+trendHTML(vsPeriod)+'</div><div class="l">Sur la période</div></div>'+
      '</div>';

    html += '<div class="card chart-wrap">'+volumeChartSVG(pts, unit)+'</div>';
    html += '<div class="seg" role="tablist" aria-label="Période">'+
      [["4w","4 semaines"],["3m","3 mois"],["all","Tout"]].map(function(p){
        return '<button class="'+(period===p[0]?'on':'')+'" data-action="histperiod" data-p="'+p[0]+'">'+p[1]+'</button>';
      }).join('')+'</div>';

    if(pts.length){
      var record = Math.max.apply(null, pts.map(function(p){ return p.vol; }));
      html += '<div class="hist-sub">'+pts.length+' séance'+(pts.length>1?'s':'')+' · record '+fmtNum(record)+' '+unit+'</div>';
      html += '<div class="card">';
      pts.slice().reverse().forEach(function(p){
        html += '<div class="hist-row2"><div class="a">'+fmtLongDate(p.ts)+'<small>'+compressSets(p.sets, cardio, ex)+'</small></div>'+
          '<div class="b">'+fmtNum(p.vol)+' '+unit+'</div></div>';
      });
      html += '</div>';
    }
    return html;
  }

  function validateImportedData(data){
    if(!data || typeof data!=="object") return false;
    if(!Array.isArray(data.exercises) || !Array.isArray(data.days)) return false;
    for(var i=0;i<data.exercises.length;i++){
      var ex = data.exercises[i];
      if(!ex || typeof ex.id!=="string" || typeof ex.name!=="string" || typeof ex.cat!=="string") return false;
    }
    for(var j=0;j<data.days.length;j++){
      var d = data.days[j];
      if(!d || typeof d.id!=="string" || !Array.isArray(d.sessions)) return false;
      for(var k=0;k<d.sessions.length;k++){
        var s = d.sessions[k];
        if(!s || typeof s.id!=="string" || !Array.isArray(s.entries)) return false;
      }
    }
    if(data.history!==undefined && !Array.isArray(data.history)) return false;
    return true;
  }

    currentTheme = currentTheme==="light" ? "dark" : "light";
    applyTheme(currentTheme);
    try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
    render();
  }

  // Séance en cours : on bloque tout défilement/rebond de la page (sauf notes, guide, résumé).
  document.addEventListener("touchmove", function(ev){
    if(!ui.guided) return;
    var tg = ev.target;
    if(tg && tg.closest && tg.closest(".note-area, .howto-modal, .howto-edit-area, .guided-summary-list")) return;
    ev.preventDefault();
  }, {passive:false});

  // ── Hors ligne : service worker (fichier sw.js à placer à côté de fonte.html) ──
  var offlineStatus = "non pris en charge";
  function askOfflineStatus(){
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:"status"});
    }catch(e){}
  }
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    offlineStatus = "en préparation…";
    navigator.serviceWorker.addEventListener("message", function(ev){
      var m = ev.data || {};
      if(m.type==="fonte-status"){
        offlineStatus = m.ready ? "prêt ✓" : "en préparation…";
        var el = document.getElementById("offlineStatus");
        if(el) el.textContent = offlineStatus;
      } else if(m.type==="fonte-update" && !ui.guided){
        showToast("Nouvelle version téléchargée — visible au prochain lancement", false, 4500);
      }
    });
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
        [600, 2500, 6000].forEach(function(ms){ setTimeout(function(){ if(reg.active) reg.active.postMessage({type:"status"}); }, ms); });
      }).catch(function(){ offlineStatus = "indisponible (sw.js introuvable ?)"; });
    });
  } else if(location.protocol!=="https:" && location.protocol!=="http:"){
    offlineStatus = "indisponible (ouvre l’app via https)";
  }

  render();
})();
</script>
</body>
</html>
