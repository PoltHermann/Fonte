<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141416">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; object-src 'none';">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>Fonte — Suivi musculation</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#141416;
    --surface:#1c1d20;
    --surface-2:#232428;
    --border:#2c2e33;
    --chalk:#f2efe9;
    --dim:#a3a5ac;
    --dim-2:#8a8d94;
    --accent:#e5482c;
    --accent-dim:#3a1f19;
    --success:#3aa15c;
    --success-dim: rgba(58,161,92,0.14);
    --warm:#34d399; --warm-dim:rgba(52,211,153,0.13); --on-warm:#06281c;
    --cat-echauffement:#e8b923;
    --cat-musculation:#e5482c;
    --cat-calisthenie:#3f7fe3;
    --cat-cardio:#3aa15c;
    --cat-etirements:#2fb8a6;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f4f0;
    --surface:#ffffff;
    --surface-2:#efebe4;
    --border:#e1dbd0;
    --chalk:#211f1c;
    --dim:#5f584e;
    --dim-2:#6e675c;
    --accent:#e5482c;
    --accent-dim:#fbe0d9;
    --success:#2f8f52;
    --success-dim: rgba(47,143,82,0.12);
    --warm:#047857; --warm-dim:rgba(4,120,87,0.10); --on-warm:#ffffff;
  }
  body{ transition: background-color .2s ease, color .2s ease; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .session-row-card, .hist-ex-row, .ex-row{
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  button:active{ transform: scale(0.97); }
  .session-row-card:active, .hist-ex-row:active{ transform: scale(0.99); }
  html,body{height:100%; touch-action:manipulation;}
  *{ touch-action:manipulation; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior-y: none;
  }
  #app{ display:flex; flex-direction:column; min-height:100vh; }
  .num{ font-variant-numeric: tabular-nums; font-weight:800; letter-spacing:-0.02em; }

  .topbar{
    padding: calc(9px + var(--safe-t)) 20px 8px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky; top:0; z-index:10;
  }
  .topbar .brand{ font-size:22px; font-weight:800; letter-spacing:0.02em; text-transform:uppercase; }
  .topbar .brand span{ color:var(--accent); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .theme-toggle{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--dim); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle:active{ background:var(--accent-dim); color:var(--accent); }

  main{ flex:1; overflow-y:auto; padding: 16px 16px calc(96px + var(--safe-b)); }

  @keyframes viewFadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  #view.fade-in{ animation: viewFadeIn .22s cubic-bezier(.22,.61,.36,1); }

  @keyframes menuDropIn{ from{ opacity:0; transform:translateY(-4px) scaleY(.96); } to{ opacity:1; transform:translateY(0) scaleY(1); } }
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim-2);
    margin: 18px 4px 10px; font-weight:700; display:flex; align-items:center; gap:7px;
  }
  .section-title:first-child{ margin-top:4px; }
  .cat-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; transition: border-color .15s ease; }
  .exercise-card.goal-met{ border-color:var(--success); }

  .exercise-card .ex-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px; }
  .exercise-card .ex-title{ font-size:16px; font-weight:700; }
  .chevron{ color:var(--dim-2); transition: transform .2s ease; font-size:14px; flex-shrink:0; }
  .exercise-card.open .chevron{ transform: rotate(90deg); }

  .ex-head-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .menu-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    width:44px; height:44px; font-size:20px; line-height:1; color:var(--dim); font-weight:900;
  }
  .menu-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .card-menu{
    display:flex; flex-direction:column; gap:2px; margin-top:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:6px;
    transform-origin:top; animation: menuDropIn .16s ease;
  }
  .card-menu button{
    text-align:left; padding:10px 10px; border-radius:8px; border:none; background:transparent;
    color:var(--chalk); font-size:13.5px; font-weight:600; transition: background-color .1s ease;
  }
  .card-menu button:active{ background:var(--bg); }
  .card-menu button.danger{ color:var(--accent); }
  .superset-badge{
    display:flex; align-items:center; gap:8px;
    border:1px solid; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700;
    margin-top:8px; background:var(--surface-2);
  }
  .link-hint{
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--chalk);
    border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px;
  }
  .link-hint a{ color:var(--accent); font-weight:700; }

  .objectif-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:13px; color:var(--dim); margin:10px 0 8px;
  }
  .objectif-row .obj-label{ color:var(--dim-2); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; margin-right:2px; }
  .rest-line{
    display:flex; align-items:center; gap:4px; font-size:12px; color:var(--dim-2);
    margin:2px 0 10px;
  }
  .rest-input-plain{
    background:transparent; border:none; border-bottom:1px dashed var(--border);
    color:var(--dim); font-size:12px; font-weight:700; width:28px; text-align:center; padding:0 1px;
  }
  .rest-input-plain:focus{ outline:none; border-bottom-color:var(--accent); color:var(--chalk); }
  .obj-input{
    width:42px; text-align:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--chalk); font-size:13px; padding:5px 2px; font-weight:700;
  }
  .obj-input:focus{ outline:none; border-color:var(--accent); }

  .result-row{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:9px 10px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);
  }
  .result-row.met{ background:var(--success-dim); border-color:var(--success); }
  .result-empty{ font-size:12.5px; color:var(--dim-2); }

  .note-area{
    width:100%; min-height:44px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:9px 12px; color:var(--chalk); font-size:13.5px; font-family:inherit;
    resize:none; overflow:hidden; line-height:1.4; margin-top:10px;
  }
  .note-area:focus{ outline:none; border-color:var(--accent); }
  .note-area::placeholder{ color:var(--dim-2); }
  .guided-note{ margin-top:16px; text-align:left; min-height:50px; }
  .goal-badge{ font-size:11px; font-weight:700; color:var(--success); margin-left:auto; white-space:nowrap; }

  .set-chip{
    background:var(--bg); border:1px solid var(--border); border-radius:999px;
    padding:5px 10px; font-size:13px; color:var(--chalk); display:flex; align-items:center; gap:6px;
  }
  .set-chip.pr{ border-color:var(--accent); color:var(--accent); }
  .set-chip .del{ color:var(--dim-2); font-size:12px; padding-left:2px; }

  .log-panel{ margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .stepper-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stepper-label{ font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--chalk); font-size:18px; font-weight:700;
  }
  .stepper button:active{ background:var(--accent-dim); }
  .stepper input{ width:64px; text-align:center; background:transparent; border:none; color:var(--chalk); font-size:20px; }
  .stepper input:focus{ outline:none; }

  .validate-btn{
    width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:700; letter-spacing:0.01em;
  }
  .validate-btn:active{ opacity:0.85; }

  .empty{ text-align:center; color:var(--dim); padding:40px 20px; font-size:14px; line-height:1.5; }
  .cta-btn{
    width:100%; padding:14px; border:1px dashed var(--border); border-radius:var(--radius);
    background:transparent; color:var(--dim); font-size:14px; font-weight:600; margin-bottom:12px;
  }
  .reset-btn{
    width:100%; padding:11px; border:1px solid var(--border); border-radius:12px;
    background:transparent; color:var(--dim); font-size:13px; font-weight:600; margin-top:2px;
  }
  .reset-btn:active{ background:var(--surface-2); }
  .danger-link{ display:block; text-align:center; color:var(--dim-2); font-size:12px; margin-top:14px; padding:6px; }
  .warmup-badge{ display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 14px; font-size:12px; font-weight:700; color:var(--accent); margin-bottom:14px; }
  .picker-banner{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .picker-banner a{ color:var(--accent); font-weight:700; white-space:nowrap; }
  .settings-back{ margin-bottom:14px; }
  .settings-back a{ color:var(--dim-2); font-size:14px; padding:6px 0; display:inline-block; }
  .settings-card{ padding:4px 16px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row select{ background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; max-width:55%; }
  .settings-inline-btn{ background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:700; }
  .warmup-picker-modal{ text-align:left; }
  .warmup-picker-row{
    width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:13px 16px; font-size:15px; font-weight:600; margin-bottom:8px;
  }
  .warmup-picker-row.is-default{ border-color:var(--accent); }
  .warmup-picker-tag{ float:right; font-size:11px; font-weight:700; color:var(--accent); }
  .ex-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .ex-card-head .name{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }

  .search-wrap{ margin-bottom:6px; }
  .search-wrap input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; color:var(--chalk); font-size:15px;
  }
  .search-wrap input::placeholder{ color:var(--dim-2); }

  .ex-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--border); gap:10px; }
  .ex-row:last-child{ border-bottom:none; }
  .ex-row .name{ font-size:14.5px; flex:1; min-width:0; }
  .ex-row-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .icon-btn-sm{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--dim); font-size:14px;
  }
  .add-circle{ width:40px; height:40px; border-radius:50%; border:1px solid var(--accent); color:var(--accent); background:transparent; font-size:18px; font-weight:700; flex-shrink:0; }
  .add-circle:active{ background:var(--accent-dim); }

  .new-ex-form{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .new-ex-form input{ flex:1 1 100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--chalk); font-size:14px; }
  .new-ex-form select{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--chalk); font-size:13px; padding:0 6px; }
  .new-ex-form button{ flex:1 1 100%; background:var(--accent); border:none; border-radius:10px; color:#fff; padding:11px; font-weight:700; }

  .edit-ex-form{ padding:11px 4px; border-bottom:1px solid var(--border); }
  .edit-ex-form:last-child{ border-bottom:none; }
  .edit-ex-form input{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--chalk); font-size:14px; margin-bottom:8px; }
  .edit-ex-form select{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--chalk); font-size:13px; padding:8px 6px; margin-bottom:8px; margin-right:6px; }
  .edit-ex-form .btn-row{ display:flex; gap:8px; }
  .edit-ex-form .btn-row button{ flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; }
  .edit-ex-form .create{ border:none; background:var(--accent); color:#fff; }
  .edit-ex-form .cancel{ border:1px solid var(--border); background:transparent; color:var(--dim); }

  .session-row-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
  }
  .session-row-card .srDate{ font-size:15px; font-weight:700; }
  .session-row-card .srMeta{ font-size:12px; color:var(--dim); margin-top:3px; }
  .session-row-card .srArrow{ color:var(--dim-2); font-size:15px; }

  .new-session-form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .new-session-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim-2); display:block; margin-bottom:5px; }
  .new-session-form .row{ margin-bottom:12px; }
  .new-session-form input{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--chalk); font-size:14px; }
  .new-session-form .btn-row{ display:flex; gap:8px; }
  .new-session-form .btn-row button{ flex:1; padding:11px; border-radius:10px; font-size:14px; font-weight:700; }
  .new-session-form .create{ border:none; background:var(--accent); color:#fff; }
  .new-session-form .cancel{ border:1px solid var(--border); background:transparent; color:var(--dim); }

  .sess-header{ margin:4px 4px 10px; }
  .sess-title{ font-size:18px; font-weight:800; }
  .name-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; color:var(--chalk); font-size:14px; margin-bottom:14px;
  }
  .session-title-input{
    background:transparent; border:none; border-radius:0;
    padding:4px 4px 12px; font-size:22px; font-weight:800; margin-bottom:6px;
  }
  .session-title-input:focus{ outline:none; border-bottom:1px solid var(--border); }
  .session-title-input::placeholder{ font-weight:700; color:var(--dim-2); }

  .muscle-row{ margin-bottom:12px; }
  .muscle-row:last-child{ margin-bottom:0; }
  .muscle-label{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:5px; }
  .muscle-label .num{ font-size:12px; color:var(--dim); font-weight:700; }
  .muscle-bar-track{ height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .muscle-bar-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }

  .backup-row{ display:flex; gap:8px; margin-bottom:20px; }
  .backup-btn{
    flex:1; padding:12px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface); color:var(--chalk); font-size:13px; font-weight:600;
  }
  .backup-btn:active{ background:var(--surface-2); }

  .hist-ex-row{ display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; gap:10px; }
  .hist-ex-row .best{ font-size:20px; flex-shrink:0; }
  .hist-ex-row .best .unit{ font-size:12px; color:var(--dim); font-weight:500; }
  .back-link{ color:var(--dim); font-size:13px; margin-bottom:14px; display:inline-block; }
  .chart-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .session-row{ display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
  .session-row:last-child{ border-bottom:none; }
  .session-row .d{ color:var(--dim); flex-shrink:0; }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:rgba(20,20,22,0.92); backdrop-filter: blur(14px);
    border-top:1px solid var(--border); padding: 5px 10px calc(5px + var(--safe-b)); z-index:20;
    transition: opacity .15s ease;
  }
  .tabbar.tabbar-locked .tab-btn{ pointer-events:none; opacity:0.35; }
  .tab-btn{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--dim-2); padding:5px 0; font-size:11px; font-weight:600; }
  .tab-btn.active{ color:var(--accent); }
  .tab-btn svg{ width:22px; height:22px; }
  @keyframes tabPulse{
    0%{ box-shadow:0 0 0 0 rgba(229,72,44,0.55); }
    70%{ box-shadow:0 0 0 6px rgba(229,72,44,0); }
    100%{ box-shadow:0 0 0 0 rgba(229,72,44,0); }
  }

  .guided-start-btn{
    width:100%; padding:14px; border:none; border-radius:var(--radius);
    background:var(--accent); color:#fff; font-size:15px; font-weight:800; letter-spacing:0.01em;
    margin-bottom:14px;
  }
  .guided-wrap{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:0 0 20px;
  }
  .guided-log, .guided-rest, .guided-done{ width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; }
  .guided-progress-wrap{ width:100%; margin-bottom:14px; }
  .guided-progress-bar{ width:100%; height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:6px; }
  .guided-progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
  .guided-progress-label{ font-size:11px; color:var(--dim-2); text-align:center; }
  .rest-next-target{ color:var(--dim-2); }
  .guided-summary-list{ width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:6px 14px; margin-bottom:22px; }
  .guided-summary-row{
    display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .guided-summary-row:last-child{ border-bottom:none; }
  .gsr-name{ font-weight:700; }
  .gsr-detail{ color:var(--dim); text-align:right; }
  .guided-ex-name{ font-size:24px; font-weight:800; margin-bottom:10px; }
  .howto-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; font-size:13px; font-weight:700; color:var(--dim); margin-bottom:16px;
  }
  .howto-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .howto-modal{
    width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + var(--safe-b)); max-height:75vh; overflow-y:auto;
    text-align:left;
  }
  .howto-modal-title{ font-size:17px; font-weight:800; margin-bottom:12px; }
  .howto-edit-area{
    width:100%; min-height:160px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; color:var(--chalk); font-size:14.5px; font-family:inherit;
    line-height:1.6; margin-bottom:14px; resize:vertical;
  }
  .howto-edit-area:focus{ outline:none; border-color:var(--accent); }
  .howto-edit-area::placeholder{ color:var(--dim-2); }
  .set-stopwatch-big{
    font-size:48px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--dim);
    margin-bottom:10px; letter-spacing:-0.02em;
  }
  .guided-target-hint{ font-size:13px; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:7px 16px; margin-bottom:22px; }
  .guided-log .stepper-row{ width:100%; margin-bottom:16px; }
  .guided-log .validate-btn{ margin-top:6px; }
  .guided-back-row{ margin-top:14px; }
  .guided-back-row a{ color:var(--dim-2); font-size:13px; padding:8px; }
  .guided-btn-row{ width:100%; display:flex; gap:10px; margin-top:12px; }
  .guided-btn{
    flex:1; padding:9px; border:none; border-radius:12px;
    font-size:11px; font-weight:700;
  }
  .guided-btn-skip{ background:var(--cat-echauffement); color:#141416; }
  .guided-btn-quit{ background:#c0392b; color:#fff; }

  @keyframes restFlash{
    0%{ box-shadow:0 0 0 0 var(--success-dim); }
    30%{ box-shadow:0 0 0 14px var(--success-dim); }
    100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); }
  }
  .guided-log.rest-flash .guided-ex-name{ animation: restFlashText .5s ease; }
  @keyframes restFlashText{ 0%{ color:var(--success); } 100%{ color:var(--chalk); } }
  .guided-log.rest-flash{ animation: restFlash .7s ease; border-radius:20px; }

  .rest-label{ font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim-2); margin-bottom:8px; }
  .rest-countdown{ font-size:96px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); margin-bottom:12px; letter-spacing:-0.03em; }
  .rest-next{ font-size:14px; color:var(--dim); margin-bottom:24px; }

  .guided-done-icon{ font-size:48px; color:var(--success); margin-bottom:10px; }
  .guided-done-title{ font-size:22px; font-weight:800; margin-bottom:6px; }
  .guided-done-sub{ font-size:14px; color:var(--dim); margin-bottom:26px; }

  .pr-toast{
    position:fixed; top: calc(70px + var(--safe-t)); left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700;
    z-index:30; opacity:0; pointer-events:none; transition: opacity .25s ease, top .25s ease;
    max-width: 85vw; text-align:center;
  }
  .pr-toast.show{ opacity:1; top: calc(84px + var(--safe-t)); }
  .pr-toast.error{ background:#8a2f26; }

  /* ===== Refonte lisibilité + écran de séance plein écran (oct. 2026) ===== */
  :root{ --bar-bg:rgba(20,20,22,0.94); --accent-text:#ff7a5c; }
  html[data-theme="light"]{ --bar-bg:rgba(247,244,240,0.94); --accent-text:#c43a22; }
  .tabbar{ background:var(--bar-bg); }
  .tab-btn{ color:var(--dim); }
  .tab-btn.active{ color:var(--accent-text); }

  .back-link{ display:inline-flex; align-items:center; min-height:44px; padding:0 10px 0 0; font-size:15px; font-weight:700; color:var(--accent-text); margin-bottom:6px; }
  .crumbs{ display:flex; align-items:center; flex-wrap:wrap; gap:0; margin:-6px 0 8px -10px; font-size:15px; }
  .crumbs a{ display:inline-flex; align-items:center; min-height:44px; padding:0 10px; border-radius:10px; color:var(--accent-text); font-weight:700; }
  .crumbs a:active{ background:var(--accent-dim); }
  .crumbs .sep{ color:var(--dim-2); font-size:18px; }
  .crumbs .cur{ padding:0 10px; font-weight:800; color:var(--chalk); min-height:44px; display:inline-flex; align-items:center; }

  .note-area{ max-height:116px; overflow-y:auto; }

  .set-chip{ align-items:stretch; padding:0 0 0 12px; gap:8px; overflow:hidden; }
  .set-chip .lbl{ display:inline-flex; align-items:center; gap:7px; padding:7px 0; }
  .set-chip .cnt{ background:var(--accent-dim); color:var(--accent-text); border-radius:999px; min-width:22px; height:22px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
  .set-chip .del{ display:inline-flex; align-items:center; justify-content:center; width:42px; border-left:1px solid var(--border); color:var(--dim); font-size:14px; padding:0; }
  .set-chip .del:active{ background:var(--accent-dim); color:var(--accent-text); }

  .card-menu{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; }
  .card-menu button{ min-height:44px; text-align:center; font-size:13px; padding:6px 8px; background:var(--bg); border:1px solid var(--border); }
  .card-menu button.danger{ grid-column:1 / -1; }

  .undo-toast{
    position:fixed; left:50%; bottom:calc(var(--safe-b) + 84px); transform:translate(-50%,16px); opacity:0; pointer-events:none;
    background:var(--chalk); color:var(--bg); border-radius:999px; padding:5px 5px 5px 18px;
    display:flex; align-items:center; gap:14px; font-size:14px; font-weight:600; z-index:60;
    transition:opacity .2s ease, transform .2s ease; box-shadow:0 6px 24px rgba(0,0,0,.28); white-space:nowrap;
  }
  .undo-toast.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .undo-toast button{ border:none; border-radius:999px; background:var(--accent); color:#fff; font-weight:800; font-size:14px; min-height:40px; padding:0 18px; }

  /* --- mode séance : plein écran, sans barres, sans scroll --- */
  html.guided-lock, html.guided-lock body{ overflow:hidden; height:100%; overscroll-behavior:none; }
  #app.app-guided{ height:100vh; height:100dvh; min-height:0; overflow:hidden; }
  #app.app-guided .topbar, #app.app-guided .tabbar{ display:none; }
  #app.app-guided main{ padding:0; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  .guided-screen{
    flex:1; min-height:0; display:flex; flex-direction:column; width:100%; max-width:430px; margin:0 auto; text-align:center;
    padding:calc(var(--safe-t) + 12px) 18px calc(var(--safe-b) + 14px);
  }
  .g-top{ flex:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .g-top .guided-progress-wrap{ margin:0; width:100%; }
  .g-top .howto-btn{ margin:0; min-height:40px; }
  .guided-progress-label{ font-size:12px; color:var(--dim); }
  .g-live{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-text); }
  .exercise-card.warm{ border-color:var(--warm); background:linear-gradient(var(--warm-dim),var(--warm-dim)),var(--surface); }
  .exercise-card.warm .ex-head{ cursor:default; }
  .warm-tag{ margin-right:8px; }
  .dup-tag{ margin-left:8px; font-size:12px; font-weight:700; color:var(--dim); }
  .warm-label{ margin:2px 0 8px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--warm); }
  .warm-section-title{ margin:16px 4px 8px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--warm); }
  .warm-section-title.std{ color:var(--dim); }
  .warm-add-btn{ display:block; width:100%; margin:4px 0 14px; padding:12px; border:1.5px dashed var(--warm); border-radius:var(--radius); background:transparent; color:var(--warm); font-size:14px; font-weight:700; cursor:pointer; }
  .warm-progress{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; color:var(--dim); }
  .warm-done-btn{ padding:9px 16px; border:0; border-radius:12px; background:var(--warm); color:var(--on-warm); font-size:14px; font-weight:800; cursor:pointer; }
  .g-top.warm .g-live{ color:var(--warm); }
  .g-top.warm .g-live i{ background:var(--warm); }
  .g-top.warm .guided-progress-fill{ background:var(--warm); }
  .guided-screen.warm .validate-btn{ background:var(--warm); color:var(--on-warm); }
  .warmup-picker-count{ color:var(--dim); font-size:12px; margin-left:6px; font-weight:500; }
  .g-toprow{ display:flex; align-items:center; justify-content:space-between; width:100%; }
  .g-clock{ font-size:12px; font-weight:700; color:var(--dim); letter-spacing:.04em; }
  .g-clock b{ margin-left:4px; font-size:17px; font-weight:800; letter-spacing:0; color:var(--chalk); font-variant-numeric:tabular-nums; }
  .g-live i{ width:8px; height:8px; border-radius:50%; background:var(--accent); animation:livePulse 1.4s ease-in-out infinite; }
  @keyframes livePulse{ 0%{ box-shadow:0 0 0 0 rgba(229,72,44,.55); } 70%{ box-shadow:0 0 0 7px rgba(229,72,44,0); } 100%{ box-shadow:0 0 0 0 rgba(229,72,44,0); } }
  .g-mid{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
  .g-mid.rest-flash{ animation:restFlash .7s ease; border-radius:20px; }
  .g-mid.rest-flash .guided-ex-name{ animation:restFlashText .5s ease; }
  .g-bottom{ flex:none; display:flex; flex-direction:column; gap:10px; width:100%; }
  .g-bottom .guided-note{ margin:0; text-align:left; }
  .g-bottom .guided-btn-row{ margin:0; }
  .guided-btn{ min-height:38px; font-size:12px; padding:10px 12px; }
  .guided-ex-name{ font-size:26px; line-height:1.15; margin:0 0 4px; }
  .g-set{ font-size:22px; font-weight:800; color:var(--accent-text); }
  .g-hint{ font-size:14px; color:var(--dim); margin:2px 0 8px; }
  .g-mid .set-stopwatch-big{ margin:0 0 12px; }
  .g-mid .stepper-row{ width:100%; margin-bottom:10px; }
  .g-mid .stepper button{ width:48px; height:48px; font-size:22px; }
  .g-mid .stepper input{ width:84px; font-size:26px; }
  .g-mid .validate-btn{ margin-top:6px; padding:16px; font-size:17px; }
  .g-undo{ margin-top:12px; background:transparent; border:1px solid var(--border); border-radius:999px; padding:0 18px; min-height:44px; font-size:13px; font-weight:700; color:var(--dim); }
  .g-undo:active{ background:var(--accent-dim); color:var(--accent-text); }
  .rest-countdown{ font-size:92px; margin:6px 0 16px; line-height:1; }
  .g-next{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .g-next .n1{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .g-next .n2{ font-size:19px; font-weight:800; }
  .g-next .n3{ font-size:14px; color:var(--dim); }
  .guided-summary-list{ max-height:42vh; overflow-y:auto; }
  @media (max-height:720px){
    .guided-ex-name{ font-size:22px; } .g-mid .set-stopwatch-big{ font-size:34px; margin-bottom:8px; }
    .rest-countdown{ font-size:72px; } .g-mid .stepper button{ width:42px; height:42px; }
    .g-mid .validate-btn{ padding:13px; font-size:16px; } .note-area{ max-height:78px; }
  }

  /* --- historique --- */
  .hist-ex-row .best-wrap{ display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; }
  .hist-ex-row .best-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:700; }
  .seg{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:4px; margin:10px 0 14px; }
  .seg button{ flex:1; min-height:40px; border:none; border-radius:9px; background:transparent; color:var(--dim); font-weight:700; font-size:13px; }
  .seg button.on{ background:var(--surface); color:var(--chalk); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 6px; text-align:center; }
  .stat .v{ font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .trend-up{ color:var(--success); } .trend-down{ color:var(--accent-text); } .trend-flat{ color:var(--dim); }
  .hist-sub{ font-size:13px; color:var(--dim); margin:-4px 4px 10px; }
  .hist-row2{ display:flex; justify-content:space-between; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .hist-row2:last-child{ border-bottom:none; }
  .hist-row2 .a{ font-size:14px; font-weight:700; }
  .hist-row2 .a small{ display:block; color:var(--dim); font-size:12.5px; font-weight:500; margin-top:2px; }
  .hist-row2 .b{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:15px; }

  /* ===== Corrections issues de l'audit (oct. 2026, 2) ===== */
  #app.app-guided{ position:fixed; top:0; right:0; bottom:0; left:0; height:auto; min-height:0; overflow:hidden; }
  .g-mid.rest{ display:grid; grid-template-rows:1fr auto 1fr; justify-items:center; align-items:center; }
  .g-mid.rest .rest-label{ align-self:end; margin:0 0 6px; }
  .g-mid.rest .rest-countdown{ margin:0; }
  .g-mid.rest .g-after{ align-self:start; display:flex; flex-direction:column; align-items:center; padding-top:18px; }
  .g-mid.rest .g-undo{ margin-top:14px; }
  .g-bottom .validate-btn{ margin:0; padding:16px; font-size:17px; width:100%; }
  .g-bottom .g-undo{ margin:0; align-self:center; }
  .g-undo{ display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .g-undo.ghost{ visibility:hidden; pointer-events:none; }
  .set-stopwatch-big.timed{ font-size:64px; }
  .set-stopwatch-big.running{ color:var(--accent-text); }
  .ico{ width:18px; height:18px; flex:none; vertical-align:-3px; }
  .icon-btn-sm .ico{ vertical-align:middle; }
  .chevron{ display:inline-flex; align-items:center; color:var(--dim); }
  .chevron .ico{ width:20px; height:20px; vertical-align:0; }
  .card-menu button .ico{ margin-right:4px; }
  .danger-link .ico{ width:15px; height:15px; vertical-align:-2px; }
  #editExHowTo.note-area{ max-height:none; overflow:hidden; }
  .chips-stamp{ font-size:12.5px; font-weight:600; color:var(--dim); margin:2px 2px 8px; }
  .pr-star{ color:var(--accent-text); font-size:12px; }
  .diag{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; margin:8px 0 4px; user-select:text; -webkit-user-select:text; }
  @media (max-height:720px){ .set-stopwatch-big.timed{ font-size:48px; } }

  /* ===== Bonus (oct. 2026, 3) ===== */
  .chk-row{ display:flex; align-items:center; gap:10px; font-size:14px; min-height:44px; padding:2px; }
  .chk-row input{ width:22px; height:22px; flex:none; }
  .g-ballast{ margin-top:2px; background:transparent; border:1px dashed var(--border); border-radius:999px; min-height:40px; padding:0 16px; font-size:13px; font-weight:700; color:var(--dim); }
  .muscle-bar-fill.low{ background:var(--accent); }
  .muscle-bar-fill.ok{ background:var(--success); }
  .muscle-bar-fill.high{ background:var(--cat-echauffement); }
  .sum-stats{ width:100%; margin:10px 0 8px; }
  .guided-summary-list{ width:100%; max-height:44vh; }
  .gsr2{ display:flex; justify-content:space-between; gap:12px; text-align:left; padding:11px 2px; border-bottom:1px solid var(--border); }
  .gsr2:last-child{ border-bottom:none; }
  .gsr2 .a b{ font-size:15px; }
  .gsr2 .a small{ display:block; color:var(--dim); font-size:12.5px; margin-top:2px; }
  .gsr2 .b{ text-align:right; font-weight:800; font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .gsr2 .b .d{ font-size:12.5px; font-weight:700; margin-top:2px; }
  .gsr2 .b .d small{ color:var(--dim); font-weight:500; }
  .rec-tag{ font-size:11px; font-weight:800; color:var(--accent-text); background:var(--accent-dim); border-radius:999px; padding:2px 8px; margin-left:6px; white-space:nowrap; }
  .backup-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--accent-dim); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .backup-banner .bb-text{ display:flex; flex-direction:column; gap:2px; font-size:14px; }
  .backup-banner .bb-text span{ font-size:12.5px; color:var(--dim); }
  .backup-banner .bb-actions{ display:flex; flex-direction:column; gap:6px; flex:none; }
  .backup-banner button{ min-height:38px; border:none; border-radius:10px; padding:0 14px; background:var(--accent); color:#fff; font-weight:800; font-size:13px; }
  .backup-banner button.ghost{ background:transparent; color:var(--dim); font-weight:700; }
</style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>

  });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var ESC_MAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
  function esc(s){
    return String(s===null||s===undefined ? "" : s).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; });
  }

  // ── État persistant : chargement sûr, réparation, mesure du stockage ──────────
  var stateChars = 0, otherChars = 0, loadNotice = null, repairedCount = 0, idsAssigned = 0;
  var STORAGE_BUDGET_CHARS = 2500000;   // ≈ 5 Mo en UTF-16 : hypothèse prudente (iOS n'indique pas le quota exact)
  var STORAGE_WARN_RATIO = 0.8;         // alerte à partir de 80 % du budget
  var CORRUPT_KEY = STORAGE_KEY + "_illisible";
  function isObj(x){ return !!x && typeof x==="object" && !Array.isArray(x); }
  function defaultState(){
    return {
      exercises: JSON.parse(JSON.stringify(DEFAULT_EXERCISES)),
      days: DAYS.map(function(d){ return {id:d.id, sessions:[]}; }),
      history: [],
      warmups: [],
      settings: {warmupDefaultByDay:{}, defaultRestSeconds:90, devMode:false}
    };
  }
  function load(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    if(raw){
      var parsed = null;
      try{ parsed = JSON.parse(raw); }catch(e){}
      if(isObj(parsed)){ stateChars = raw.length; return parsed; }
      // Données illisibles : on garde une copie brute AVANT que le prochain save() n'écrase tout.
      var kept = false;
      try{ localStorage.setItem(CORRUPT_KEY, raw); kept = true; }catch(e){}
      loadNotice = {title:"Données illisibles",
        text: kept ? "Tes données enregistrées étaient abîmées. Une copie brute est conservée (Paramètres → Sauvegarde). Restaure ta dernière sauvegarde exportée."
                   : "Tes données enregistrées étaient abîmées et la copie de secours n’a pas pu être conservée. Restaure ta dernière sauvegarde exportée."};
    }
    return defaultState();
  }
  // Rend l'état utilisable quoi qu'il contienne (ancien export, import partiel, stockage abîmé).
  // Chaque élément retiré ou reconstruit incrémente repairedCount (pour prévenir l'utilisateur).
  function arr(v){ if(Array.isArray(v)) return v; if(v!==undefined && v!==null) repairedCount++; return []; }
  function healEntries(list, exercises){
    var kept = [], seenIds = {};
    arr(list).forEach(function(en){
      if(!isObj(en) || typeof en.exerciseId!=="string"){ repairedCount++; return; }
      if(typeof en.id!=="string" || seenIds[en.id]){ en.id = uid(); idsAssigned++; }
      seenIds[en.id] = true;
      if(!Array.isArray(en.sets)){ en.sets = []; repairedCount++; }
      if(en.warmup!==undefined && en.warmup!==true) delete en.warmup;
      if(!isObj(en.target)){
        var ex = null;
        for(var i=0;i<exercises.length;i++) if(exercises[i].id===en.exerciseId){ ex = exercises[i]; break; }
        en.target = (ex && ex.cat==="Cardio") ? {duration:20, speed:10, distance:3, rest:90} : {sets:3, reps:8, weight:20, rest:90};
        repairedCount++;
      }
      kept.push(en);
    });
    return kept;
  }
  function repairState(s){
    if(!isObj(s)) return null;
    if(!Array.isArray(s.exercises)){
      repairedCount++;
      s.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
    }
    s.exercises = s.exercises.filter(function(e){
      var ok = isObj(e) && typeof e.id==="string" && typeof e.name==="string";
      if(!ok) repairedCount++;
      return ok;
    });
    s.exercises.forEach(function(e){ if(typeof e.cat!=="string"){ e.cat = "Musculation"; repairedCount++; } });
    s.days = arr(s.days).filter(function(d){
      var ok = isObj(d) && typeof d.id==="string";
      if(!ok) repairedCount++;
      return ok;
    });
    s.days.forEach(function(d){
      d.sessions = arr(d.sessions).filter(function(x){
        var ok = isObj(x) && typeof x.id==="string";
        if(!ok) repairedCount++;
        return ok;
      });
      d.sessions.forEach(function(x){ x.entries = healEntries(x.entries, s.exercises); normalizeWarmBlock(x); });
    });
    DAYS.forEach(function(d){
      if(!s.days.some(function(x){ return x.id===d.id; })) s.days.push({id:d.id, sessions:[]});
    });
    s.history = arr(s.history).filter(function(h){
      var ok = isObj(h);
      if(!ok) repairedCount++;
      return ok;
    });
    s.warmups = arr(s.warmups).filter(function(w){
      var ok = isObj(w) && typeof w.id==="string";
      if(!ok) repairedCount++;
      return ok;
    });
    s.warmups.forEach(function(w){
      if(typeof w.name!=="string") w.name = "Échauffement";
      w.entries = healEntries(w.entries, s.exercises);
    });
    if(!isObj(s.settings)) s.settings = {};
    if(!isObj(s.settings.warmupDefaultByDay)) s.settings.warmupDefaultByDay = {};
    if(typeof s.settings.defaultRestSeconds!=="number") s.settings.defaultRestSeconds = 90;
    if(typeof s.settings.devMode!=="boolean") s.settings.devMode = false;
    if(!isObj(s.settings.weeklyGoals)) s.settings.weeklyGoals = JSON.parse(JSON.stringify(DEFAULT_GOALS));

    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    var idx = -1;
    e.sets.forEach(function(st, i){ if(st.id===setId) idx = i; });
    var removedSet = idx>=0 ? e.sets[idx] : null;
    var removedHist = state.history.filter(function(h){ return h.setId===setId; });
    e.sets = e.sets.filter(function(st){ return st.id!==setId; });
    state.history = state.history.filter(function(h){ return h.setId!==setId; });
    save(); render();
    if(!silent && removedSet){
      showUndoToast("Série supprimée", function(){ restoreSet(sessionId, exId, removedSet, idx, removedHist); });
    }
  }
  function restoreSet(sessionId, exId, st, idx, hist){
    var loc = findSession(sessionId);
    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    if(!e.sets.some(function(x){ return x.id===st.id; })) e.sets.splice(Math.min(idx, e.sets.length), 0, st);

  function setTarget(sessionId, exId, prop, value){
    var loc = findSession(sessionId);
    if(!loc) return;
    var e = entryFor(loc.session, exId);
    if(!e) return;
    var ex = getExercise(e.exerciseId);
    if(isWarmEntry(e)){
      // Cible d'échauffement : on n'alimente PAS lastTarget (mémoire des objectifs « normaux »).
      if(!e.target) e.target = isCardio(ex) ? {duration:5, speed:5, distance:0.5, rest:30} : JSON.parse(JSON.stringify(WARM_TARGET));
      if(e.target.rest===undefined) e.target.rest = 30;
      e.target[prop] = value;
      if(prop==="mode" && value==="timed" && !e.target.seconds) e.target.seconds = 30;
      save(); render();
      return;
    }
    if(isCardio(ex)){
      if(!e.target) e.target = {duration:DEFAULT_TARGET_CARDIO.duration, speed:DEFAULT_TARGET_CARDIO.speed, distance:DEFAULT_TARGET_CARDIO.distance, rest:DEFAULT_TARGET_CARDIO.rest};
      if(e.target.rest===undefined) e.target.rest = DEFAULT_TARGET_CARDIO.rest;
      e.target[prop] = value;
      ex.lastTarget = {duration:e.target.duration, speed:e.target.speed, distance:e.target.distance, rest:e.target.rest};
    } else {
      if(!e.target) e.target = {sets:DEFAULT_TARGET.sets, reps:DEFAULT_TARGET.reps, weight:DEFAULT_TARGET.weight, rest:(state.settings.defaultRestSeconds||DEFAULT_TARGET.rest)};
      if(e.target.rest===undefined) e.target.rest = (state.settings.defaultRestSeconds||DEFAULT_TARGET.rest);
      e.target[prop] = value;
      ex.lastTarget = {sets:e.target.sets, reps:e.target.reps, weight:e.target.weight, rest:e.target.rest};

    save(); render();

  function mergeHowToImport(data){
    var map = {};
    if(Array.isArray(data)){
      data.forEach(function(item){ if(item && item.name) map[String(item.name).trim().toLowerCase()] = item.howTo||""; });
    } else if(data && typeof data==="object"){
      Object.keys(data).forEach(function(k){ map[k.trim().toLowerCase()] = data[k]; });
    }
    var count = 0;
    state.exercises.forEach(function(ex){
      var key = ex.name.trim().toLowerCase();
      if(map[key]!==undefined){ ex.howTo = map[key]; count++; }

  // Import de modèles d'échauffement complets : format attendu
  // [{name, exercises:[{name, cat, muscle, howTo, target}, ...]}, ...]
  // Les exercices sont retrouvés par nom (insensible à la casse) et créés
  // automatiquement s'ils n'existent pas encore — rien à préparer côté utilisateur.
  function findExerciseByName(name){
    var key = String(name).trim().toLowerCase();
    for(var i=0;i<state.exercises.length;i++){
      if(state.exercises[i].name.trim().toLowerCase()===key) return state.exercises[i];
    }
    return null;
  }
  function mergeWarmupImport(data){
    if(!Array.isArray(data)) return 0;
    var count = 0;
    data.forEach(function(item){
      if(!item || !item.name || !Array.isArray(item.exercises)) return;
      var entries = [];
      item.exercises.forEach(function(exSpec){
        if(!exSpec || !exSpec.name) return;
        var ex = findExerciseByName(exSpec.name);
        if(!ex){
          ex = {id:uid(), name:exSpec.name, cat:exSpec.cat||"Échauffement", muscle:exSpec.muscle||"Cardio"};
          if(exSpec.bodyweight!==undefined) ex.bodyweight = !!exSpec.bodyweight;
          if(exSpec.perHand!==undefined) ex.perHand = !!exSpec.perHand;
          state.exercises.push(ex);
        }
        if(exSpec.howTo){ ex.howTo = exSpec.howTo; }
        var restDefault = (state.settings && state.settings.defaultRestSeconds) || DEFAULT_TARGET.rest;
        var t = exSpec.target || {};
        var target = isCardio(ex)
          ? {duration:t.duration!==undefined?t.duration:DEFAULT_TARGET_CARDIO.duration, speed:t.speed!==undefined?t.speed:DEFAULT_TARGET_CARDIO.speed, distance:t.distance!==undefined?t.distance:DEFAULT_TARGET_CARDIO.distance, rest:t.rest!==undefined?t.rest:restDefault}
          : {sets:t.sets!==undefined?t.sets:1, reps:t.reps!==undefined?t.reps:1, weight:t.weight!==undefined?t.weight:0, rest:t.rest!==undefined?t.rest:restDefault};
        if(t.mode) target.mode = t.mode;
        if(t.seconds!==undefined) target.seconds = t.seconds;
        entries.push({exerciseId:ex.id, target:target, note:"", sets:[], supersetId:null});
      });
      var existing = state.warmups.find(function(w){ return w.name.trim().toLowerCase()===item.name.trim().toLowerCase(); });
      if(existing){ existing.entries = entries; }
      else { state.warmups.push({id:uid(), name:item.name, entries:entries}); }
      count++;
    });
    save(); render();
    return count;
  }

  var wakeLock = null;
  function requestWakeLock(){

      if('wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(function(lock){
          wakeLock = lock;
          lock.addEventListener('release', function(){
            wakeLock = null;
            // Safari sometimes drops the lock silently; re-acquire right away if the session is still running.
            if(ui.guided && document.visibilityState === 'visible') requestWakeLock();
          });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}

  document.addEventListener('visibilitychange', function(){

  var setStopwatchTimer = null;

  function tickSetStopwatch(){
    if(!ui.guided || ui.guided.phase!=="log"){ clearInterval(setStopwatchTimer); setStopwatchTimer=null; return; }
    if(!wakeLock) requestWakeLock();
    var el = document.getElementById("setStopwatch");
    if(ui.guided.timedEndsAt){
      var rem = (ui.guided.timedEndsAt - Date.now())/1000;
      if(rem<=0){ ui.guided.timedEndsAt = null; playBeep(); guidedValidateSet(); return; }
      if(el) el.textContent = formatTime(Math.ceil(rem));
      return;
    }
    var srcT = guidedSource();
    var enT = srcT && srcT.entries[ui.guided.entryIndex];
    if(isWarmEntry(enT) && (entryMode(enT)==="timed" || entryMode(enT)==="done")) return;
    if(el) el.textContent = formatTime((Date.now()-ui.guided.setStartedAt)/1000);
  }
  function guidedStartTimer(){
    if(!ui.guided || ui.guided.phase!=="log") return;
    var srcS = guidedSource();
    var enS = srcS && srcS.entries[ui.guided.entryIndex];
    var secs = (enS && enS.target && enS.target.seconds) || 30;
    ui.guided.timedEndsAt = Date.now() + secs*1000;
    render();

  function exitGuided(){

  // Bouton « Quitter » : pendant l'échauffement, deux issues très différentes (sauter le bloc
  // d'échauffement et passer aux exercices, ou tout abandonner) → petit choix dédié ;
  // pendant la séance : confirmation classique.
  function guidedQuitRequest(){

      ui.guided.showQuitChoice = true;

  // « Passer à la séance » : saute ce qui reste du bloc d'échauffement (compté comme « passé »).
  function warmupQuitSkipToSession(){
    if(!ui.guided) return;
    var session = guidedSource();
    if(!session) return;
    var n = warmCount(session), remaining = 0;
    for(var i=ui.guided.entryIndex;i<n;i++){
      var en = session.entries[i], exq = getExercise(en.exerciseId);
      if(!exq) continue;
      var tot = isCardio(exq) ? 1 : ((en.target && en.target.sets) || 1);
      remaining += (i===ui.guided.entryIndex) ? Math.max(0, tot-(ui.guided.setNumber-1)) : tot;
    }
    ui.guided.warmSkipped += remaining;
    clearInterval(guidedTimer); guidedTimer=null;
    clearInterval(setStopwatchTimer); setStopwatchTimer=null;
    leaveWarmBlock(session);
    ui.guided.timedEndsAt = null;
    ui.guided.showQuitChoice = false;
    ui.guided.entryIndex = n;
    ui.guided.setNumber = 1;
    ui.guided.phase = "log";
    ui.guided.setStartedAt = Date.now();
    if(n>=session.entries.length){ finishGuidedRun(); return; }
    render();
    startSetStopwatch();
  }

  function finishGuidedRun(){

  function guidedGoRest(target){
    clearInterval(setStopwatchTimer); setStopwatchTimer = null;
    var restSec = (target && target.rest) || 90;
    ui.guided.phase = "rest";
    ui.guided.restEndsAt = Date.now() + restSec*1000;
    render();
    clearInterval(guidedTimer);

  function tickGuidedRest(){
    if(!ui.guided || ui.guided.phase!=="rest"){ clearInterval(guidedTimer); guidedTimer=null; return; }
    if(!wakeLock) requestWakeLock();
    var remaining = (ui.guided.restEndsAt - Date.now())/1000;
    var el = document.getElementById("restCountdown");
    if(el) el.textContent = formatTime(remaining);
    // Ré-amorce le clip silencieux toutes les ~5s : sur les repos longs, iOS peut
    // "oublier" le déverrouillage audio ; un rappel régulier et silencieux limite le risque.
    var remainingInt = Math.ceil(remaining);
    if(remainingInt>0 && remainingInt % 5 === 0 && remainingInt !== ui.guided.lastAudioPrimeAt){
      ui.guided.lastAudioPrimeAt = remainingInt;
      unlockGuidedAudio();
    }
    if(remaining<=0){
      clearInterval(guidedTimer); guidedTimer=null;
      playBeep();
      ui.guided.phase = "log";
      ui.guided.setStartedAt = Date.now();
      ui.guided.justFinishedRest = true;
      render();
      startSetStopwatch();
    }

  function guidedValidateSet(){
    if(!ui.guided) return;
    ui.guided.timedEndsAt = null;
    var session = guidedSource();
    if(!session){ ui.guided=null; render(); return; }
    var entry = session.entries[ui.guided.entryIndex];
    if(!entry){ ui.guided.phase="done"; render(); return; }
    var ex = getExercise(entry.exerciseId);
    if(!ex){ ui.guided.entryIndex++; ui.guided.setNumber=1; render(); return; }
    addSet(ui.guided.sessionId, entry.id);
    if(isWarmEntry(entry)) ui.guided.warmLogged++; else ui.guided.setsLogged++;
    var target = entry.target || {};
    var totalSets = isCardio(ex) ? 1 : (target.sets || 1);
    var isLastSetOfExercise = ui.guided.setNumber >= totalSets;
    var isLastExercise = ui.guided.entryIndex >= session.entries.length-1;
    if(isLastSetOfExercise && isLastExercise){
      finishGuidedRun();
      return;
    }
    if(isLastSetOfExercise){
      ui.guided.entryIndex++;
      ui.guided.setNumber = 1;
      // Fin du bloc d'échauffement : on enchaîne directement sur le 1er exercice, sans repos.
      var nextAfter = session.entries[ui.guided.entryIndex];
      if(isWarmEntry(entry) && nextAfter && !isWarmEntry(nextAfter)){
        leaveWarmBlock(session);
        ui.guided.phase = "log";
        ui.guided.setStartedAt = Date.now();
        render();
        startSetStopwatch();
        return;
      }
    } else {
      ui.guided.setNumber++;
    }
    guidedGoRest(target);
  }
  function guidedSkipRest(){
    if(!ui.guided || ui.guided.phase!=="rest") return;
    if(!window.confirm("Passer le reste du repos ?")) return;
    clearInterval(guidedTimer); guidedTimer=null;

  function guidedSkipExercise(){
    if(!ui.guided) return;
    if(!window.confirm("Passer cet exercice ? Les séries restantes ne seront pas enregistrées.")) return;
    ui.guided.timedEndsAt = null;
    clearInterval(guidedTimer); guidedTimer=null;
    var session = guidedSource();
    if(session){
      var curEntry = session.entries[ui.guided.entryIndex];
      var curEx = curEntry && getExercise(curEntry.exerciseId);
      if(curEx){
        var curTotalSets = isCardio(curEx) ? 1 : ((curEntry.target && curEntry.target.sets) || 1);
        var skipN = Math.max(0, curTotalSets - (ui.guided.setNumber - 1));
        if(isWarmEntry(curEntry)) ui.guided.warmSkipped += skipN; else ui.guided.setsSkipped += skipN;
      }
    }
    ui.guided.entryIndex++;
    ui.guided.setNumber = 1;
    if(!session || ui.guided.entryIndex >= session.entries.length){
      finishGuidedRun();
      return;
    } else {
      var nowE = session.entries[ui.guided.entryIndex];
      if(curEntry && isWarmEntry(curEntry) && nowE && !isWarmEntry(nowE)) leaveWarmBlock(session);
      ui.guided.phase = "log";
      ui.guided.setStartedAt = Date.now();
    }
    render();
    if(ui.guided.phase==="log") startSetStopwatch();
  }
  function guidedGoBack(){
    if(!ui.guided) return;
    ui.guided.timedEndsAt = null;
    clearInterval(guidedTimer); guidedTimer=null;
    var session = guidedSource();
    if(!session) return;
    if(ui.guided.setNumber > 1){
      ui.guided.setNumber--;
    } else if(ui.guided.entryIndex > 0){
      ui.guided.entryIndex--;
      var prevEntry = session.entries[ui.guided.entryIndex];
      var prevEx = prevEntry && getExercise(prevEntry.exerciseId);
      ui.guided.setNumber = prevEx ? (isCardio(prevEx) ? 1 : ((prevEntry.target && prevEntry.target.sets) || 1)) : 1;
    } else {
      return;
    }
    var entry = session.entries[ui.guided.entryIndex];
    if(entry && entry.sets.length){
      var lastSet = entry.sets[entry.sets.length-1];
      deleteSet(ui.guided.sessionId, entry.id, lastSet.id, true);
      if(isWarmEntry(entry)) ui.guided.warmLogged = Math.max(0, ui.guided.warmLogged-1);
      else ui.guided.setsLogged = Math.max(0, ui.guided.setsLogged-1);
    }
    ui.guided.phase = "log";
    ui.guided.setStartedAt = Date.now();
    render();
    startSetStopwatch();
  }

  function toggleLink(sessionId, exId){

    if(!ui.linkFrom || ui.linkFrom.session!==sessionId){
      // Nothing pending, or the pending link was started in a different session
      // (e.g. user navigated away without cancelling) — a superset can only link
      // exercises within the same session, so start a fresh selection here.
      ui.linkFrom = {session:sessionId, ex:exId};

    var loc1 = findSession(ui.linkFrom.session);

  function moveExercise(sessionId, exId, dir){
    var loc = findSession(sessionId);
    if(!loc) return;
    var arr = loc.session.entries;
    var idx = -1;
    var mvE = entryFor(loc.session, exId);
    idx = mvE ? arr.indexOf(mvE) : -1;
    if(idx<0) return;
    var newIdx = idx + dir;
    if(newIdx<0 || newIdx>=arr.length) return;
    if(isWarmEntry(arr[idx]) !== isWarmEntry(arr[newIdx])) return;   // le bloc d'échauffement reste en tête
    var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
    save(); render();

  function groupSets(sets, cardio){
    var map = {}, order = [];
    sets.forEach(function(st){
      var key = cardio ? (st.distance+"|"+st.speed+"|"+st.duration) : (st.weight+"|"+st.reps);
      if(!map[key]){ map[key] = {count:0, pr:false, lastId:null, weight:st.weight, reps:st.reps, duration:st.duration, speed:st.speed, distance:st.distance}; order.push(key); }
      map[key].count++;
      map[key].lastId = st.id;
      if(st.pr) map[key].pr = true;
    });
    return order.map(function(k){ return map[k]; });
  }

  function crumbs(items){
    var h = '<nav class="crumbs" aria-label="Fil d’Ariane">';
    items.forEach(function(it, i){
      if(i>0) h += '<span class="sep" aria-hidden="true">›</span>';
      if(it.a) h += '<a data-action="'+it.a+'">'+esc(it.t)+'</a>';
      else h += '<span class="cur">'+esc(it.cur)+'</span>';
    });
    return h + '</nav>';
  }
  var SVG_ATTR = 'class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var ICON = {
    undo:    '<svg '+SVG_ATTR+'><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
    trash:   '<svg '+SVG_ATTR+'><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
    edit:    '<svg '+SVG_ATTR+'><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    chevron: '<svg '+SVG_ATTR+'><path d="m9 6 6 6-6 6"/></svg>'
  };
  function entryMode(entry){
    var m = entry && entry.target && entry.target.mode;
    return (m==="reps" || m==="timed" || m==="done") ? m : "load";
  }
  // Résumé daté des séries affichées (dates retrouvées via l'historique, sans rien stocker de plus).
  function setsStamp(sets){
    if(!sets.length) return "";
    var ids = {}; sets.forEach(function(s){ ids[s.id] = true; });
    var days = {};
    state.history.forEach(function(h){ if(ids[h.setId]) days[localDayKey(h.ts)] = h.ts; });
    var keys = Object.keys(days).sort();
    if(!keys.length) return "";
    var first = days[keys[0]], last = days[keys[keys.length-1]];
    return keys.length===1 ? "Séance du "+fmtShortDate(last)
      : "Cumul du "+fmtShortDate(first)+" au "+fmtShortDate(last)+" · remis à zéro au prochain lancement";
  }
  // ---------- Poids du corps / haltères / indicateurs ----------
  function isBodyweight(ex){
    return !!ex && !isCardio(ex) && (ex.bodyweight===true || (ex.bodyweight===undefined && ex.cat==="Calisthénie"));
  }
  function volFactor(ex){ return (ex && ex.perHand===true && !isBodyweight(ex) && !isCardio(ex)) ? 2 : 1; }
  function unitOf(ex){ return isCardio(ex) ? "km" : (isBodyweight(ex) ? "reps" : "kg"); }
  function setVolume(ex, h){
    if(isCardio(ex)) return h.distance||0;
    if(isBodyweight(ex)) return h.reps||0;
    return (h.weight||0)*(h.reps||0)*volFactor(ex);
  }
  function bestRepsAllTime(exId){
    var b = 0;
    state.history.forEach(function(h){ if(h.exerciseId===exId && (h.reps||0)>b) b = h.reps; });
    return b;
  }
  function recordOf(ex){ return isBodyweight(ex) ? bestRepsAllTime(ex.id) : bestAllTime(ex.id); }
  function isPRSet(ex, d, exId){
    if(isCardio(ex)) return d.distance > bestAllTime(exId);
    if(isBodyweight(ex)){
      var dominated = false;
      state.history.forEach(function(h){
        if(h.exerciseId===exId && (h.weight||0)>=(d.weight||0) && (h.reps||0)>=(d.reps||0)) dominated = true;
      });
      return !dominated;
    }
    return d.weight > bestAllTime(exId);
  }
  function loadLabel(ex, w, r){
    if(isBodyweight(ex)) return (w>0 ? '+'+w+'kg × ' : '')+r+' reps';
    return w+'kg × '+r;
  }
  function showBallast(ex, target, d){
    return !!(ui.ballast[ex.id] || (target && target.weight>0) || (d && d.weight>0));
  }
  function daysSince(ts){ return Math.floor((Date.now()-ts)/86400000); }
  function exportAgeText(){
    var ts = state.settings.lastExportTs;
    if(!ts) return "jamais";
    var n = daysSince(ts);
    return n<=0 ? "aujourd'hui" : "il y a "+n+" jour"+(n>1?"s":"");
  }
  function backupDue(){
    var s = state.settings;
    if(state.history.length < 10) return false;
    if(s.exportSnoozeUntil && Date.now() < s.exportSnoozeUntil) return false;
    return !s.lastExportTs || (Date.now()-s.lastExportTs) > 14*86400000;
  }
  function markExported(){
    state.settings.lastExportTs = Date.now();
    delete state.settings.exportSnoozeUntil;
    save(); render();
  }
  // Résumé de fin de séance : volume, comparaison avec la dernière séance, records.
  function sessionSummary(entries){
    var todayKey = localDayKey(Date.now());
    var rows = [], totalKg = 0, records = 0;
    entries.forEach(function(e){
      var exx = getExercise(e.exerciseId);
      if(isWarmEntry(e) || !exx || !e.sets.length) return;
      var cardioX = isCardio(exx), bw = isBodyweight(exx);
      var pts = volumePoints(e.exerciseId);
      var today = null, prev = null;
      pts.forEach(function(p){ if(p.key===todayKey) today = p; else prev = p; });
      var delta = (today && prev) ? pctChange(prev.vol, today.vol) : null;
      var bestBefore = 0;
      state.history.forEach(function(h){
        if(h.exerciseId!==e.exerciseId || localDayKey(h.ts)===todayKey) return;
        var v = cardioX ? (h.distance||0) : (bw ? (h.reps||0) : (h.weight||0));
        if(v>bestBefore) bestBefore = v;
      });
      var isRec = !!(today && prev && today.max > bestBefore);
      if(isRec) records++;
      if(!cardioX && !bw && today) totalKg += today.vol;
      var partsTxt = groupSets(e.sets, cardioX).map(function(g){
        return (g.count>1 ? g.count+'× ' : '') + (cardioX ? (g.distance+'km·'+g.speed+'km/h') : loadLabel(exx, g.weight, g.reps));
      }).join(' · ');
      rows.push('<div class="gsr2"><div class="a"><b>'+esc(exx.name)+'</b>'+(isRec?'<span class="rec-tag">★ Record</span>':'')+'<small>'+partsTxt+'</small></div>'+
        '<div class="b">'+(today ? fmtNum(today.vol)+' '+unitOf(exx) : '—')+
        '<div class="d">'+(delta===null ? '<span class="trend-flat">1re fois</span>' : trendHTML(delta)+' <small>vs '+fmtShortDate(prev.ts)+'</small>')+'</div></div></div>');
    });
    return {rows:rows, totalKg:totalKg, records:records};
  }
