<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141416">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; object-src 'none';">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>Fonte — Suivi musculation</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#141416;
    --surface:#1c1d20;
    --surface-2:#232428;
    --border:#2c2e33;
    --chalk:#f2efe9;
    --dim:#9a9ca3;
    --dim-2:#6b6d73;
    --accent:#e5482c;
    --accent-dim:#3a1f19;
    --success:#3aa15c;
    --success-dim: rgba(58,161,92,0.14);
    --cat-echauffement:#e8b923;
    --cat-musculation:#e5482c;
    --cat-calisthenie:#3f7fe3;
    --cat-cardio:#3aa15c;
    --cat-etirements:#2fb8a6;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f4f0;
    --surface:#ffffff;
    --surface-2:#efebe4;
    --border:#e1dbd0;
    --chalk:#211f1c;
    --dim:#726c62;
    --dim-2:#a29a8c;
    --accent:#e5482c;
    --accent-dim:#fbe0d9;
    --success:#2f8f52;
    --success-dim: rgba(47,143,82,0.12);
  }
  body{ transition: background-color .2s ease, color .2s ease; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .session-row-card, .hist-ex-row, .ex-row{
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  button:active{ transform: scale(0.97); }
  .session-row-card:active, .hist-ex-row:active{ transform: scale(0.99); }
  html,body{height:100%; touch-action:manipulation;}
  *{ touch-action:manipulation; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior-y: none;
  }
  #app{ display:flex; flex-direction:column; min-height:100vh; }
  .num{ font-variant-numeric: tabular-nums; font-weight:800; letter-spacing:-0.02em; }

  .topbar{
    padding: calc(9px + var(--safe-t)) 20px 8px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky; top:0; z-index:10;
  }
  .topbar .brand{ font-size:22px; font-weight:800; letter-spacing:0.02em; text-transform:uppercase; }
  .topbar .brand span{ color:var(--accent); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .theme-toggle{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--dim); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle:active{ background:var(--accent-dim); color:var(--accent); }

  main{ flex:1; overflow-y:auto; padding: 16px 16px calc(96px + var(--safe-b)); }

  @keyframes viewFadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  #view.fade-in{ animation: viewFadeIn .22s cubic-bezier(.22,.61,.36,1); }

  @keyframes menuDropIn{ from{ opacity:0; transform:translateY(-4px) scaleY(.96); } to{ opacity:1; transform:translateY(0) scaleY(1); } }
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim-2);
    margin: 18px 4px 10px; font-weight:700; display:flex; align-items:center; gap:7px;
  }
  .section-title:first-child{ margin-top:4px; }
  .cat-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; transition: border-color .15s ease; }
  .exercise-card.goal-met{ border-color:var(--success); }

  .exercise-card .ex-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px; }
  .exercise-card .ex-title{ font-size:16px; font-weight:700; }
  .chevron{ color:var(--dim-2); transition: transform .2s ease; font-size:14px; flex-shrink:0; }
  .exercise-card.open .chevron{ transform: rotate(90deg); }

  .ex-head-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .menu-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    width:44px; height:44px; font-size:20px; line-height:1; color:var(--dim); font-weight:900;
  }
  .menu-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .card-menu{
    display:flex; flex-direction:column; gap:2px; margin-top:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:6px;
    transform-origin:top; animation: menuDropIn .16s ease;
  }
  .card-menu button{
    text-align:left; padding:10px 10px; border-radius:8px; border:none; background:transparent;
    color:var(--chalk); font-size:13.5px; font-weight:600; transition: background-color .1s ease;
  }
  .card-menu button:active{ background:var(--bg); }
  .card-menu button.danger{ color:var(--accent); }
  .superset-badge{
    display:flex; align-items:center; gap:8px;
    border:1px solid; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700;
    margin-top:8px; background:var(--surface-2);
  }
  .link-hint{
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--chalk);
    border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px;
  }
  .link-hint a{ color:var(--accent); font-weight:700; }

  .objectif-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:13px; color:var(--dim); margin:10px 0 8px;
  }
  .objectif-row .obj-label{ color:var(--dim-2); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; margin-right:2px; }
  .rest-line{
    display:flex; align-items:center; gap:4px; font-size:12px; color:var(--dim-2);
    margin:2px 0 10px;
  }
  .rest-input-plain{
    background:transparent; border:none; border-bottom:1px dashed var(--border);
    color:var(--dim); font-size:12px; font-weight:700; width:28px; text-align:center; padding:0 1px;
  }
  .rest-input-plain:focus{ outline:none; border-bottom-color:var(--accent); color:var(--chalk); }
  .obj-input{
    width:42px; text-align:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--chalk); font-size:13px; padding:5px 2px; font-weight:700;
  }
  .obj-input:focus{ outline:none; border-color:var(--accent); }

  .result-row{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:9px 10px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);
  }
  .result-row.met{ background:var(--success-dim); border-color:var(--success); }
  .result-empty{ font-size:12.5px; color:var(--dim-2); }

  .note-area{
    width:100%; min-height:44px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:9px 12px; color:var(--chalk); font-size:13.5px; font-family:inherit;
    resize:none; overflow:hidden; line-height:1.4; margin-top:10px;
  }
  .note-area:focus{ outline:none; border-color:var(--accent); }
  .note-area::placeholder{ color:var(--dim-2); }
  .guided-note{ margin-top:16px; text-align:left; min-height:50px; }
  .goal-badge{ font-size:11px; font-weight:700; color:var(--success); margin-left:auto; white-space:nowrap; }

  .set-chip{
    background:var(--bg); border:1px solid var(--border); border-radius:999px;
    padding:5px 10px; font-size:13px; color:var(--chalk); display:flex; align-items:center; gap:6px;
  }
  .set-chip.pr{ border-color:var(--accent); color:var(--accent); }
  .set-chip .del{ color:var(--dim-2); font-size:12px; padding-left:2px; }

  .log-panel{ margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .stepper-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stepper-label{ font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--chalk); font-size:18px; font-weight:700;
  }
  .stepper button:active{ background:var(--accent-dim); }
  .stepper input{ width:64px; text-align:center; background:transparent; border:none; color:var(--chalk); font-size:20px; }
  .stepper input:focus{ outline:none; }

  .validate-btn{
    width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:700; letter-spacing:0.01em;
  }
  .validate-btn:active{ opacity:0.85; }

  .empty{ text-align:center; color:var(--dim); padding:40px 20px; font-size:14px; line-height:1.5; }
  .cta-btn{
    width:100%; padding:14px; border:1px dashed var(--border); border-radius:var(--radius);
    background:transparent; color:var(--dim); font-size:14px; font-weight:600; margin-bottom:12px;
  }
  .reset-btn{
    width:100%; padding:11px; border:1px solid var(--border); border-radius:12px;
    background:transparent; color:var(--dim); font-size:13px; font-weight:600; margin-top:2px;
  }
  .reset-btn:active{ background:var(--surface-2); }
  .danger-link{ display:block; text-align:center; color:var(--dim-2); font-size:12px; margin-top:14px; padding:6px; }

  .search-wrap{ margin-bottom:6px; }
  .search-wrap input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; color:var(--chalk); font-size:15px;
  }
  .search-wrap input::placeholder{ color:var(--dim-2); }

  .ex-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--border); gap:10px; }
  .ex-row:last-child{ border-bottom:none; }
  .ex-row .name{ font-size:14.5px; flex:1; min-width:0; }
  .ex-row-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .icon-btn-sm{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--dim); font-size:14px;
  }
  .add-circle{ width:40px; height:40px; border-radius:50%; border:1px solid var(--accent); color:var(--accent); background:transparent; font-size:18px; font-weight:700; flex-shrink:0; }
  .add-circle:active{ background:var(--accent-dim); }

  .new-ex-form{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .new-ex-form input{ flex:1 1 100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--chalk); font-size:14px; }
  .new-ex-form select{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--chalk); font-size:13px; padding:0 6px; }
  .new-ex-form button{ flex:1 1 100%; background:var(--accent); border:none; border-radius:10px; color:#fff; padding:11px; font-weight:700; }

  .edit-ex-form{ padding:11px 4px; border-bottom:1px solid var(--border); }
  .edit-ex-form:last-child{ border-bottom:none; }
  .edit-ex-form input{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--chalk); font-size:14px; margin-bottom:8px; }
  .edit-ex-form select{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--chalk); font-size:13px; padding:8px 6px; margin-bottom:8px; margin-right:6px; }
  .edit-ex-form .btn-row{ display:flex; gap:8px; }
  .edit-ex-form .btn-row button{ flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; }
  .edit-ex-form .create{ border:none; background:var(--accent); color:#fff; }
  .edit-ex-form .cancel{ border:1px solid var(--border); background:transparent; color:var(--dim); }

  .session-row-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
  }
  .session-row-card .srDate{ font-size:15px; font-weight:700; }
  .session-row-card .srMeta{ font-size:12px; color:var(--dim); margin-top:3px; }
  .session-row-card .srArrow{ color:var(--dim-2); font-size:15px; }

  .new-session-form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .new-session-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim-2); display:block; margin-bottom:5px; }
  .new-session-form .row{ margin-bottom:12px; }
  .new-session-form input{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--chalk); font-size:14px; }
  .new-session-form .btn-row{ display:flex; gap:8px; }
  .new-session-form .btn-row button{ flex:1; padding:11px; border-radius:10px; font-size:14px; font-weight:700; }
  .new-session-form .create{ border:none; background:var(--accent); color:#fff; }
  .new-session-form .cancel{ border:1px solid var(--border); background:transparent; color:var(--dim); }

  .sess-header{ margin:4px 4px 10px; }
  .sess-title{ font-size:18px; font-weight:800; }
  .name-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; color:var(--chalk); font-size:14px; margin-bottom:14px;
  }
  .session-title-input{
    background:transparent; border:none; border-radius:0;
    padding:4px 4px 12px; font-size:22px; font-weight:800; margin-bottom:6px;
  }
  .session-title-input:focus{ outline:none; border-bottom:1px solid var(--border); }
  .session-title-input::placeholder{ font-weight:700; color:var(--dim-2); }

  .muscle-row{ margin-bottom:12px; }
  .muscle-row:last-child{ margin-bottom:0; }
  .muscle-label{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:5px; }
  .muscle-label .num{ font-size:12px; color:var(--dim); font-weight:700; }
  .muscle-bar-track{ height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .muscle-bar-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }

  .backup-row{ display:flex; gap:8px; margin-bottom:20px; }
  .backup-btn{
    flex:1; padding:12px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface); color:var(--chalk); font-size:13px; font-weight:600;
  }
  .backup-btn:active{ background:var(--surface-2); }

  .hist-ex-row{ display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; gap:10px; }
  .hist-ex-row .best{ font-size:20px; flex-shrink:0; }
  .hist-ex-row .best .unit{ font-size:12px; color:var(--dim); font-weight:500; }
  .back-link{ color:var(--dim); font-size:13px; margin-bottom:14px; display:inline-block; }
  .chart-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .session-row{ display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
  .session-row:last-child{ border-bottom:none; }
  .session-row .d{ color:var(--dim); flex-shrink:0; }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:rgba(20,20,22,0.92); backdrop-filter: blur(14px);
    border-top:1px solid var(--border); padding: 5px 10px calc(5px + var(--safe-b)); z-index:20;
    transition: opacity .15s ease;
  }
  .tabbar.tabbar-locked .tab-btn{ pointer-events:none; opacity:0.35; }
  .tab-btn{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--dim-2); padding:5px 0; font-size:11px; font-weight:600; }
  .tab-btn.active{ color:var(--accent); }
  .tab-btn svg{ width:22px; height:22px; }
  .tab-pulse-dot{ display:none; position:absolute; top:2px; right:calc(50% - 18px); width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .tab-btn.has-pulse .tab-pulse-dot{ display:block; animation: tabPulse 1.4s ease-in-out infinite; }
  @keyframes tabPulse{
    0%{ box-shadow:0 0 0 0 rgba(229,72,44,0.55); }
    70%{ box-shadow:0 0 0 6px rgba(229,72,44,0); }
    100%{ box-shadow:0 0 0 0 rgba(229,72,44,0); }
  }

  .guided-start-btn{
    width:100%; padding:14px; border:none; border-radius:var(--radius);
    background:var(--accent); color:#fff; font-size:15px; font-weight:800; letter-spacing:0.01em;
    margin-bottom:14px;
  }
  .guided-wrap{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:0 0 20px;
  }
  .guided-log, .guided-rest, .guided-done{ width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; }
  .guided-progress-wrap{ width:100%; margin-bottom:14px; }
  .guided-progress-bar{ width:100%; height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:6px; }
  .guided-progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
  .guided-progress-label{ font-size:11px; color:var(--dim-2); text-align:center; }
  .rest-next-target{ color:var(--dim-2); }
  .guided-summary-list{ width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:6px 14px; margin-bottom:22px; }
  .guided-summary-row{
    display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .guided-summary-row:last-child{ border-bottom:none; }
  .gsr-name{ font-weight:700; }
  .gsr-detail{ color:var(--dim); text-align:right; }
  .guided-ex-name{ font-size:24px; font-weight:800; margin-bottom:10px; }
  .howto-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; font-size:13px; font-weight:700; color:var(--dim); margin-bottom:16px;
  }
  .howto-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .howto-modal{
    width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + var(--safe-b)); max-height:75vh; overflow-y:auto;
    text-align:left;
  }
  .howto-modal-title{ font-size:17px; font-weight:800; margin-bottom:12px; }
  .howto-edit-area{
    width:100%; min-height:160px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; color:var(--chalk); font-size:14.5px; font-family:inherit;
    line-height:1.6; margin-bottom:14px; resize:vertical;
  }
  .howto-edit-area:focus{ outline:none; border-color:var(--accent); }
  .howto-edit-area::placeholder{ color:var(--dim-2); }
  .set-stopwatch-big{
    font-size:48px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--dim);
    margin-bottom:10px; letter-spacing:-0.02em;
  }
  .guided-target-hint{ font-size:13px; color:var(--dim); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:7px 16px; margin-bottom:22px; }
  .guided-log .stepper-row{ width:100%; margin-bottom:16px; }
  .guided-log .validate-btn{ margin-top:6px; }
  .guided-back-row{ margin-top:14px; }
  .guided-back-row a{ color:var(--dim-2); font-size:13px; padding:8px; }
  .guided-btn-row{ width:100%; display:flex; gap:10px; margin-top:12px; }
  .guided-btn{
    flex:1; padding:9px; border:none; border-radius:12px;
    font-size:11px; font-weight:700;
  }
  .guided-btn-skip{ background:var(--cat-echauffement); color:#141416; }
  .guided-btn-quit{ background:#c0392b; color:#fff; }

  @keyframes restFlash{
    0%{ box-shadow:0 0 0 0 var(--success-dim); }
    30%{ box-shadow:0 0 0 14px var(--success-dim); }
    100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); }
  }
  .guided-log.rest-flash .guided-ex-name{ animation: restFlashText .5s ease; }
  @keyframes restFlashText{ 0%{ color:var(--success); } 100%{ color:var(--chalk); } }
  .guided-log.rest-flash{ animation: restFlash .7s ease; border-radius:20px; }

  .rest-label{ font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim-2); margin-bottom:8px; }
  .rest-countdown{ font-size:96px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); margin-bottom:12px; letter-spacing:-0.03em; }
  .rest-next{ font-size:14px; color:var(--dim); margin-bottom:24px; }

  .guided-done-icon{ font-size:48px; color:var(--success); margin-bottom:10px; }
  .guided-done-title{ font-size:22px; font-weight:800; margin-bottom:6px; }
  .guided-done-sub{ font-size:14px; color:var(--dim); margin-bottom:26px; }

  .pr-toast{
    position:fixed; top: calc(70px + var(--safe-t)); left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700;
    z-index:30; opacity:0; pointer-events:none; transition: opacity .25s ease, top .25s ease;
    max-width: 85vw; text-align:center;
  }
  .pr-toast.show{ opacity:1; top: calc(84px + var(--safe-t)); }
  .pr-toast.error{ background:#8a2f26; }
</style>

      if(v>best) best = v;
    });

  function draftFor(exId){
    if(!ui.draft[exId]){
      var ex = getExercise(exId);
      if(isCardio(ex)){
        ui.draft[exId] = { duration: ex.lastDuration || 20, speed: ex.lastSpeed || 10, distance: ex.lastDistance || 3 };
      } else {
        ui.draft[exId] = { weight: ex.lastWeight || 20, reps: ex.lastReps || 8 };
      }

  var lastAddSetTs = 0;
  var lastAddSetKey = "";
  function addSet(sessionId, exId){
    var now = Date.now();
    var key = sessionId+"|"+exId;
    if(key===lastAddSetKey && now - lastAddSetTs < 300) return;
    lastAddSetTs = now;
    lastAddSetKey = key;
    var loc = findSession(sessionId);
    if(!loc) return;
    var session = loc.session;
    var e = entryFor(session, exId);
    if(!e){ e = makeEntry(exId); session.entries.push(e); }
    var d = draftFor(exId);
    var ex = getExercise(exId);
    var prevBest = bestAllTime(exId);
    var setId = uid();
    if(isCardio(ex)){
      var isPRc = d.distance > prevBest;
      e.sets.push({id:setId, duration:d.duration, speed:d.speed, distance:d.distance, pr:isPRc});
      state.history.push({id:uid(), setId:setId, ts:Date.now(), dayId:loc.day.id, exerciseId:exId, duration:d.duration, speed:d.speed, distance:d.distance});
      ex.lastDuration = d.duration; ex.lastSpeed = d.speed; ex.lastDistance = d.distance;
      save(); render();
      if(isPRc) showPR();
    } else {
      var isPR = d.weight > prevBest;
      e.sets.push({id:setId, weight:d.weight, reps:d.reps, pr:isPR});
      state.history.push({id:uid(), setId:setId, ts:Date.now(), dayId:loc.day.id, exerciseId:exId, weight:d.weight, reps:d.reps});
      ex.lastWeight = d.weight; ex.lastReps = d.reps;
      save(); render();
      if(isPR) showPR();
    }
  }

  function unlockGuidedAudio(){

        a.pause(); a.currentTime = 0;

  var wakeLock = null;
  function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(function(lock){
          wakeLock = lock;
          lock.addEventListener('release', function(){
            wakeLock = null;
            // Safari sometimes drops the lock silently; re-acquire right away if the session is still running.
            if(ui.guided && document.visibilityState === 'visible') requestWakeLock();
          });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && ui.guided && !wakeLock) requestWakeLock();
  });
  window.addEventListener('pageshow', function(){
    if(ui.guided && !wakeLock) requestWakeLock();
  });
  document.addEventListener('click', function(){
    if(ui.guided && !wakeLock) requestWakeLock();
  });

  var setStopwatchTimer = null;
  function startSetStopwatch(){
    clearInterval(setStopwatchTimer);
    setStopwatchTimer = setInterval(tickSetStopwatch, 250);
  }
  function tickSetStopwatch(){
    if(!ui.guided || ui.guided.phase!=="log"){ clearInterval(setStopwatchTimer); setStopwatchTimer=null; return; }
    if(!wakeLock) requestWakeLock();
    var el = document.getElementById("setStopwatch");
    if(el) el.textContent = formatTime((Date.now()-ui.guided.setStartedAt)/1000);
  }
  function exitGuided(){
    if(ui.guided && ui.guided.phase!=="done"){
      if(!window.confirm("Quitter le mode guidé ? Les séries déjà validées restent enregistrées.")) return;

    clearInterval(guidedTimer); guidedTimer = null;
    clearInterval(setStopwatchTimer); setStopwatchTimer = null;
    releaseWakeLock();
    ui.guided = null;
    render();
  }
  function guidedGoRest(target){
    clearInterval(setStopwatchTimer); setStopwatchTimer = null;
    var restSec = (target && target.rest) || 90;
    ui.guided.phase = "rest";
    ui.guided.restEndsAt = Date.now() + restSec*1000;
    render();
    clearInterval(guidedTimer);
    guidedTimer = setInterval(tickGuidedRest, 250);
  }
  function tickGuidedRest(){
    if(!ui.guided || ui.guided.phase!=="rest"){ clearInterval(guidedTimer); guidedTimer=null; return; }
    if(!wakeLock) requestWakeLock();
    var remaining = (ui.guided.restEndsAt - Date.now())/1000;
    var el = document.getElementById("restCountdown");
    if(el) el.textContent = formatTime(remaining);
    if(remaining<=0){
      clearInterval(guidedTimer); guidedTimer=null;
      unlockGuidedAudio();
      playBeep();
      ui.guided.phase = "log";
      ui.guided.setStartedAt = Date.now();
      ui.guided.justFinishedRest = true;
      render();
      startSetStopwatch();
    }
  }
  function guidedValidateSet(){
    if(!ui.guided) return;
    var loc = findSession(ui.guided.sessionId);
    if(!loc){ ui.guided=null; render(); return; }
    var entry = loc.session.entries[ui.guided.entryIndex];
    if(!entry){ ui.guided.phase="done"; render(); return; }
    var ex = getExercise(entry.exerciseId);
    if(!ex){ ui.guided.entryIndex++; ui.guided.setNumber=1; render(); return; }
    addSet(ui.guided.sessionId, entry.exerciseId);
    ui.guided.setsLogged++;
    var target = entry.target || {};
    var totalSets = isCardio(ex) ? 1 : (target.sets || 1);
    var isLastSetOfExercise = ui.guided.setNumber >= totalSets;
    var isLastExercise = ui.guided.entryIndex >= loc.session.entries.length-1;
    if(isLastSetOfExercise && isLastExercise){
      clearInterval(guidedTimer); guidedTimer=null;
      clearInterval(setStopwatchTimer); setStopwatchTimer=null;
      ui.guided.phase = "done";
      render();
      return;
    }
    if(isLastSetOfExercise){
      ui.guided.entryIndex++;
      ui.guided.setNumber = 1;
    } else {
      ui.guided.setNumber++;
    }
    guidedGoRest(target);
  }
  function guidedSkipRest(){
    if(!ui.guided || ui.guided.phase!=="rest") return;
    if(!window.confirm("Passer le reste du repos ?")) return;
    clearInterval(guidedTimer); guidedTimer=null;
    ui.guided.phase = "log";
    ui.guided.setStartedAt = Date.now();
    render();
    startSetStopwatch();
  }
  function guidedSkipExercise(){
    if(!ui.guided) return;
    if(!window.confirm("Passer cet exercice ? Les séries restantes ne seront pas enregistrées.")) return;
    clearInterval(guidedTimer); guidedTimer=null;
    var loc = findSession(ui.guided.sessionId);
    if(loc){
      var curEntry = loc.session.entries[ui.guided.entryIndex];
      var curEx = curEntry && getExercise(curEntry.exerciseId);
      if(curEx){
        var curTotalSets = isCardio(curEx) ? 1 : ((curEntry.target && curEntry.target.sets) || 1);
        ui.guided.setsSkipped += Math.max(0, curTotalSets - (ui.guided.setNumber - 1));
      }
    }
    ui.guided.entryIndex++;
    ui.guided.setNumber = 1;
    if(!loc || ui.guided.entryIndex >= loc.session.entries.length){
      clearInterval(setStopwatchTimer); setStopwatchTimer=null;
      ui.guided.phase = "done";
    } else {
      ui.guided.phase = "log";
      ui.guided.setStartedAt = Date.now();
    }
    render();
    if(ui.guided.phase==="log") startSetStopwatch();
  }
  function guidedGoBack(){
    if(!ui.guided) return;
    clearInterval(guidedTimer); guidedTimer=null;
    var loc = findSession(ui.guided.sessionId);
    if(!loc) return;
    if(ui.guided.setNumber > 1){
      ui.guided.setNumber--;
    } else if(ui.guided.entryIndex > 0){
      ui.guided.entryIndex--;
    } else {
      return;
    }
    var entry = loc.session.entries[ui.guided.entryIndex];
    if(entry && entry.sets.length){
      var lastSet = entry.sets[entry.sets.length-1];
      deleteSet(ui.guided.sessionId, entry.exerciseId, lastSet.id);
      ui.guided.setsLogged = Math.max(0, ui.guided.setsLogged-1);
    }
    ui.guided.phase = "log";
    ui.guided.setStartedAt = Date.now();
    render();
    startSetStopwatch();
  }

  var SUPERSET_COLORS = ["--cat-musculation","--cat-calisthenie","--cat-cardio","--cat-etirements","--cat-echauffement"];
  function supersetColor(gid){
    var h = 0;
    for(var i=0;i<gid.length;i++) h = (h*31 + gid.charCodeAt(i)) % SUPERSET_COLORS.length;

  function toggleLink(sessionId, exId){
    if(ui.linkFrom && ui.linkFrom.session===sessionId && ui.linkFrom.ex===exId){
      ui.linkFrom = null; render(); return;
    }
    if(!ui.linkFrom || ui.linkFrom.session!==sessionId){
      // Nothing pending, or the pending link was started in a different session
      // (e.g. user navigated away without cancelling) — a superset can only link
      // exercises within the same session, so start a fresh selection here.
      ui.linkFrom = {session:sessionId, ex:exId};
      render(); return;
    }
    var loc1 = findSession(ui.linkFrom.session);
    if(!loc1){ ui.linkFrom = null; render(); return; }
    var e1 = entryFor(loc1.session, ui.linkFrom.ex);
    var e2 = entryFor(loc1.session, exId);

    var gid = e1.supersetId || e2.supersetId || uid();

  function moveExercise(sessionId, exId, dir){
    var loc = findSession(sessionId);

    var arr = loc.session.entries;
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].exerciseId===exId){ idx=i; break; } }
    if(idx<0) return;
    var newIdx = idx + dir;
    if(newIdx<0 || newIdx>=arr.length) return;
    var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
    save(); render();
  }

  function groupSets(sets, cardio){
    var map = {}, order = [];
    sets.forEach(function(st){
      var key = cardio ? (st.distance+"|"+st.speed+"|"+st.duration) : (st.weight+"|"+st.reps);
      if(!map[key]){ map[key] = {count:0, pr:false, lastId:null, weight:st.weight, reps:st.reps, duration:st.duration, speed:st.speed, distance:st.distance}; order.push(key); }
      map[key].count++;
      map[key].lastId = st.id;
      if(st.pr) map[key].pr = true;
    });
    return order.map(function(k){ return map[k]; });
  }

    var loc = findSession(ui.guided.sessionId);

    var session = loc.session;
    var entries = session.entries;

    if(ui.guided.phase==="done" || ui.guided.entryIndex >= entries.length){
      var mins = Math.max(1, Math.round((Date.now()-ui.guided.startedAt)/60000));

        '<div class="guided-done-icon">✓</div>'+
        '<div class="guided-done-title">Séance terminée</div>'+

      html2 += '<div class="guided-summary-list">';
      entries.forEach(function(e){
        var exx = getExercise(e.exerciseId);
        if(!exx) return;
        var cardioX = isCardio(exx);
        var groups = groupSets(e.sets, cardioX);
        var partsTxt = groups.map(function(g){
          return (g.count>1 ? g.count+'× ' : '') + (cardioX ? (g.distance+'km·'+g.speed+'km/h') : (g.weight+'kg×'+g.reps));
        }).join(', ');
        html2 += '<div class="guided-summary-row"><span class="gsr-name">'+esc(exx.name)+'</span>'+

      html2 += '<button class="validate-btn" data-action="guidedexit">Terminer</button>'+

    var target = entry.target || {};

    html += '<div class="set-stopwatch-big" id="setStopwatch">'+formatTime((Date.now()-ui.guided.setStartedAt)/1000)+'</div>';
    if(cardio){
      html += '<div class="guided-target-hint">'+target.duration+' min × '+target.speed+' km/h × '+target.distance+' km · Série '+ui.guided.setNumber+'/'+totalSets+'</div>';
      html += '<div class="stepper-row"><span class="stepper-label">Durée (min)</span><div class="stepper">'+

        stepBtn(-0.5,entry.exerciseId,"speed","−","Diminuer la vitesse")+

        stepBtn(0.5,entry.exerciseId,"speed","+","Augmenter la vitesse")+'</div></div>';
      html += '<div class="stepper-row"><span class="stepper-label">Distance (km)</span><div class="stepper">'+
        stepBtn(-0.5,entry.exerciseId,"distance","−","Diminuer la distance")+
        '<input class="num" type="text" inputmode="decimal" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="distance" value="'+d.distance+'">'+
        stepBtn(0.5,entry.exerciseId,"distance","+","Augmenter la distance")+'</div></div>';

        stepBtn(1,entry.exerciseId,"weight","+","Augmenter le poids")+'</div></div>';
      html += '<div class="stepper-row"><span class="stepper-label">Répétitions</span><div class="stepper">'+
        stepBtn(-1,entry.exerciseId,"reps","−","Diminuer les répétitions")+
        '<input class="num" type="text" inputmode="numeric" data-action="setval" data-target="'+entry.exerciseId+'" data-prop="reps" value="'+d.reps+'">'+

  function computeMuscleVolume(){
    var vol = {};
    MUSCLE_ORDER.forEach(function(m){ vol[m] = 0; });
    var since = Date.now() - 7*24*60*60*1000;
    state.history.forEach(function(h){
      if(h.ts < since) return;
      var ex = getExercise(h.exerciseId);
      if(!ex || !ex.muscle) return;
      if(vol[ex.muscle]===undefined) vol[ex.muscle] = 0;
      vol[ex.muscle] += 1;
    });
    return vol;
  }

  function renderMuscleVolume(){
    var vol = computeMuscleVolume();
    var max = 1;
    MUSCLE_ORDER.forEach(function(m){ if(vol[m]>max) max = vol[m]; });
    var html = '<div class="section-title">Suivi musculaire (7 derniers jours)</div><div class="card">';
    MUSCLE_ORDER.forEach(function(m){
      var v = vol[m]||0;
      var pct = Math.round((v/max)*100);
      html += '<div class="muscle-row">'+
        '<div class="muscle-label"><span>'+m+'</span><span class="num">'+v+' série'+(v>1?'s':'')+'</span></div>'+
        '<div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:'+pct+'%"></div></div>'+
        '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderHistorique(){
    if(ui.historyDetail) return renderHistoryDetail(ui.historyDetail);
    var seen = {};
    state.history.forEach(function(h){ seen[h.exerciseId] = true; });
    var withData = state.exercises.filter(function(ex){ return seen[ex.id]; });
    var html = renderMuscleVolume();
    if(withData.length===0){
      html += '<div class="empty">Ton historique apparaîtra ici dès ta première série validée.</div>';
    } else {
      html += '<div class="section-title">Progression par exercice</div>';
      withData.forEach(function(ex){
        var best = bestAllTime(ex.id);
        html += '<div class="hist-ex-row" data-action="opendetail" data-ex="'+ex.id+'">'+
          '<span style="flex:1">'+catDot(ex.cat)+' '+esc(ex.name)+'</span><span class="best num">'+best+' <span class="unit">'+(isCardio(ex)?'km':'kg')+'</span></span></div>';
      });
    }
    html += '<div class="section-title">Sauvegarde</div>';
    html += '<div class="backup-row">'+
      '<button class="backup-btn" data-action="exportdata">Exporter mes données</button>'+
      '<button class="backup-btn" data-action="importdata">Restaurer une sauvegarde</button>'+
      '</div>';
    html += '<button class="backup-btn" style="width:100%; margin-bottom:20px;" data-action="importhowto">📋 Importer les fiches techniques</button>';
    html += '<input type="file" id="importFile" accept="application/json" style="display:none">';
    html += '<input type="file" id="importHowToFile" accept="application/json" style="display:none">';
    return html;
  }

  function renderHistoryDetail(exId){
    var ex = getExercise(exId);
    var entries = state.history.filter(function(h){ return h.exerciseId===exId; }).slice().sort(function(a,b){ return a.ts-b.ts; });
    var byDate = {}, order = [];
    entries.forEach(function(h){
      var ds = new Date(h.ts).toISOString().slice(0,10);
      if(!byDate[ds]){ byDate[ds]=[]; order.push(ds); }
      byDate[ds].push(h);
    });
    var cardio = isCardio(ex);
    var points = order.map(function(ds){
      var arr = byDate[ds];
      var maxW = Math.max.apply(null, arr.map(function(x){return cardio ? x.distance : x.weight;}));
      return { dayId: arr[0].dayId, weight: maxW, sets: arr };
    });
    var html = '<a class="back-link" data-action="closedetail">‹ Historique</a>';
    html += '<div class="section-title">'+catDot(ex.cat)+esc(ex.name)+'</div>';
    html += '<div class="chart-wrap">'+lineChartSVG(points, cardio?"km":"kg")+'</div>';
    html += '<div class="card">';
    points.slice().reverse().forEach(function(p){
      var setsTxt = cardio
        ? p.sets.map(function(st){return st.distance+'km ('+st.speed+'km/h, '+st.duration+'min)';}).join(", ")
        : p.sets.map(function(st){return st.weight+'×'+st.reps;}).join(", ");
      html += '<div class="session-row"><span class="d">'+dayLabel(p.dayId)+'</span><span>'+setsTxt+'</span></div>';
    });
    html += '</div>';
    return html;
  }

  function lineChartSVG(points, unit){
    unit = unit || "kg";
    if(points.length===0) return '<div class="empty">Pas encore de données.</div>';
    if(points.length===1){
      return '<svg width="100%" height="90" viewBox="0 0 300 90"><circle cx="150" cy="45" r="5" fill="var(--accent)"/><text x="150" y="70" fill="var(--dim)" font-size="12" text-anchor="middle">'+points[0].weight+' '+unit+'</text></svg>';
    }
    var W=300,H2=90,pad=16;
    var ws = points.map(function(p){return p.weight;});
    var min = Math.min.apply(null, ws), max = Math.max.apply(null, ws);
    if(min===max){ min-=5; max+=5; }
    var stepX = (W-2*pad)/(points.length-1);
    var coords = points.map(function(p,i){
      var x = pad+i*stepX;
      var y = H2-pad-((p.weight-min)/(max-min))*(H2-2*pad);
      return [x,y];
    });
    var path = coords.map(function(c,i){ return (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1); }).join(" ");
    var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>'; }).join("");
    return '<svg width="100%" height="'+H2+'" viewBox="0 0 '+W+' '+H2+'"><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
  }

  function autoSizeTextareas(){
    document.querySelectorAll(".note-area").forEach(function(ta){
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
    });
  }
  function render(){
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===ui.tab); });
    var tabbarEl = document.querySelector(".tabbar");
    if(tabbarEl) tabbarEl.classList.toggle("tabbar-locked", !!ui.guided);
    var seanceTabBtn = document.querySelector('.tab-btn[data-tab="seance"]');
    if(seanceTabBtn) seanceTabBtn.classList.toggle("has-pulse", !!ui.guided);
    var main = document.querySelector("main");
    var scrollPos = main ? main.scrollTop : 0;
    var view = document.getElementById("view");
    if(ui.guided) view.innerHTML = renderGuided();
    else if(ui.tab==="seance") view.innerHTML = renderSeance();
    else if(ui.tab==="exercices") view.innerHTML = renderExercices();
    else view.innerHTML = renderHistorique();
    if(main) main.scrollTop = scrollPos;
    autoSizeTextareas();
    view.classList.remove("fade-in");
    void view.offsetWidth;
    view.classList.add("fade-in");
  }

  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){
      if(ui.guided) return;
      ui.tab = b.dataset.tab;
      if(ui.tab==="historique") ui.historyDetail = null;
      ui.linkFrom = null;
      ui.openMenu = null;
      render();
    });
  });

  document.getElementById("app").addEventListener("click", function(ev){
    var t = ev.target.closest("[data-action]");
    if(!t) return;
    var action = t.dataset.action;
    if(action==="toggle"){
      var exId = t.dataset.ex;
      ui.openExercise = (ui.openExercise===exId) ? null : exId;
      render();
    } else if(action==="addtoday"){
      quickAddExercise(t.dataset.ex);
    } else if(action==="goto-exercices"){
      ui.tab="exercices"; render();
    } else if(action==="openday"){
      ui.activeDay = t.dataset.id; ui.activeSession = null; ui.newSessionForm = false; ui.linkFrom = null; ui.openMenu = null; render();
    } else if(action==="closeday"){
      ui.activeDay = null; ui.linkFrom = null; ui.openMenu = null; render();
    } else if(action==="newsession"){
      ui.newSessionForm = true; render();
    } else if(action==="cancelnewsession"){
      ui.newSessionForm = false; render();
    } else if(action==="createsession"){
      var nameVal = document.getElementById("newSessName").value.trim();
      var s = createSessionInDay(t.dataset.day, nameVal);
      ui.newSessionForm = false; ui.activeSession = s.id;
      render();
    } else if(action==="opensession"){
      ui.activeSession = t.dataset.id; ui.openExercise = null; ui.linkFrom = null; ui.openMenu = null; render();
    } else if(action==="closesession"){
      ui.activeSession = null; ui.linkFrom = null; ui.openMenu = null; render();
    } else if(action==="resetsession"){
      resetSession(t.dataset.session);
    } else if(action==="deletesession"){
      deleteSession(t.dataset.session);
    } else if(action==="step"){
      var d = draftFor(t.dataset.target);
      var prop = t.dataset.prop, delta = parseFloat(t.dataset.delta);
      var zeroFloor = (prop==="weight"||prop==="speed"||prop==="distance");
      d[prop] = Math.max(zeroFloor?0:1, +(d[prop]+delta).toFixed(2));
      render();
    } else if(action==="addset"){
      addSet(t.dataset.session, t.dataset.ex);
    } else if(action==="delset"){
      deleteSet(t.dataset.session, t.dataset.ex, t.dataset.set);
    } else if(action==="startguided"){
      startGuided(t.dataset.session);
    } else if(action==="guidedvalidate"){
      unlockGuidedAudio();
      guidedValidateSet();
    } else if(action==="guidedskiprest"){
      unlockGuidedAudio();
      guidedSkipRest();
    } else if(action==="guidedskipexercise"){
      unlockGuidedAudio();
      guidedSkipExercise();
    } else if(action==="guidedgoback"){
      guidedGoBack();
    } else if(action==="guidedexit"){
      exitGuided();
    } else if(action==="togglehowto"){
      ui.guided.showHowTo = !ui.guided.showHowTo;
      render();
    } else if(action==="closehowto"){
      ui.guided.showHowTo = false;
      render();
    } else if(action==="noop"){
      // absorb clicks inside the how-to modal so they don't bubble to the closing overlay
    } else if(action==="editexfromseance"){
      ui.editingExercise = t.dataset.ex; ui.tab = "exercices"; render();
    } else if(action==="togglemenu"){
      ui.openMenu = (ui.openMenu===t.dataset.ex) ? null : t.dataset.ex;
      render();
    } else if(action==="linktoggle"){
      ui.openMenu = null;
      toggleLink(t.dataset.session, t.dataset.ex);
    } else if(action==="unlink"){
      ui.openMenu = null;
      unlinkSuperset(t.dataset.session, t.dataset.ex);
    } else if(action==="cancellink"){
      ui.linkFrom = null; render();
    } else if(action==="moveex"){
      ui.openMenu = null;
      moveExercise(t.dataset.session, t.dataset.ex, parseInt(t.dataset.dir,10));
    } else if(action==="removeex"){
      ui.openMenu = null;
      removeExerciseFromSession(t.dataset.session, t.dataset.ex);
    } else if(action==="editex"){
      ui.editingExercise = t.dataset.ex; render();
    } else if(action==="canceleditex"){
      ui.editingExercise = null; render();
    } else if(action==="saveeditex"){
      var newName = document.getElementById("editExName").value.trim();
      if(!newName){ window.alert("Le nom ne peut pas être vide."); return; }
      var newCat = document.getElementById("editExCat").value;
      var newMuscle = document.getElementById("editExMuscle").value;
      var newHowTo = document.getElementById("editExHowTo").value;
      ui.editingExercise = null;
      updateExercise(t.dataset.ex, newName, newCat, newMuscle, newHowTo);
    } else if(action==="deleteex"){
      deleteExerciseFromLibrary(t.dataset.ex);
    } else if(action==="createex"){
      var nameInput = document.getElementById("newExName");
      var catInput = document.getElementById("newExCat");
      var muscleInput = document.getElementById("newExMuscle");
      var name = nameInput.value.trim();
      if(!name) return;
      state.exercises.push({id:uid(), name:name, cat:catInput.value, muscle:muscleInput.value});
      save(); render();
    } else if(action==="opendetail"){
      ui.historyDetail = t.dataset.ex; render();
    } else if(action==="closedetail"){
      ui.historyDetail = null; render();
    } else if(action==="exportdata"){
      exportData();
    } else if(action==="importdata"){
      document.getElementById("importFile").click();
    } else if(action==="importhowto"){
      document.getElementById("importHowToFile").click();
    }
  });

  function validateImportedData(data){
    if(!data || typeof data!=="object") return false;
    if(!Array.isArray(data.exercises) || !Array.isArray(data.days)) return false;
    for(var i=0;i<data.exercises.length;i++){
      var ex = data.exercises[i];
      if(!ex || typeof ex.id!=="string" || typeof ex.name!=="string" || typeof ex.cat!=="string") return false;
    }
    for(var j=0;j<data.days.length;j++){
      var d = data.days[j];
      if(!d || typeof d.id!=="string" || !Array.isArray(d.sessions)) return false;
      for(var k=0;k<d.sessions.length;k++){
        var s = d.sessions[k];
        if(!s || typeof s.id!=="string" || !Array.isArray(s.entries)) return false;
      }
    }
    if(data.history!==undefined && !Array.isArray(data.history)) return false;
    return true;
  }

  document.getElementById("app").addEventListener("change", function(ev){
    var t = ev.target;
    if(t.id==="importFile" && t.files && t.files[0]){
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var data = JSON.parse(reader.result);
          if(!validateImportedData(data)){ window.alert("Fichier invalide ou de format inattendu."); return; }
          if(!window.confirm("Restaurer cette sauvegarde ? Les données actuelles seront remplacées.")) return;
          state = data;
          if(!state.history) state.history = [];
          save();
          ui.activeDay = null; ui.activeSession = null; ui.historyDetail = null;
          render();
        }catch(e){
          window.alert("Impossible de lire ce fichier.");
        }
      };
      reader.readAsText(t.files[0]);
    }
    if(t.id==="importHowToFile" && t.files && t.files[0]){
      var reader2 = new FileReader();
      reader2.onload = function(){
        try{
          var data2 = JSON.parse(reader2.result);
          var count = mergeHowToImport(data2);
          window.alert(count+" exercice"+(count>1?"s":"")+" mis à jour avec leur fiche technique.");
        }catch(e){
          window.alert("Impossible de lire ce fichier.");
        }
      };
      reader2.readAsText(t.files[0]);
    }
    if(t.dataset.action==="setval"){
      var d = draftFor(t.dataset.target);
      var v = parseFloat(t.value);
      if(isNaN(v)) v = 0;
      d[t.dataset.prop] = v;
      render();
    } else if(t.dataset.role==="sessionname"){
      setSessionName(t.dataset.session, t.value.trim());
    } else if(t.dataset.role==="note"){
      setNote(t.dataset.session, t.dataset.ex, t.value);
    } else if(t.dataset.role==="howto"){
      setHowTo(t.dataset.ex, t.value);
    } else if(t.dataset.role && t.dataset.role.indexOf("target-")===0){
      var prop = t.dataset.role.replace("target-","");
      var v2 = parseFloat(t.value);
      if(isNaN(v2) || v2<0) v2 = 0;
      setTarget(t.dataset.session, t.dataset.ex, prop, v2);
    }
  });

  document.getElementById("app").addEventListener("input", function(ev){
    var t = ev.target;
    if(t.id==="exSearch"){
      ui.exerciseQuery = t.value;
      var pos = t.selectionStart;
      render();
      var el = document.getElementById("exSearch");
      if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
    } else if(t.classList.contains("note-area")){
      t.style.height = "auto";
      t.style.height = t.scrollHeight + "px";
    }
  });

  document.getElementById("app").addEventListener("focusin", function(ev){
    var t = ev.target;
    if(t.tagName==="INPUT" && t.classList.contains("num")){
      try{ t.select(); }catch(e){}
    }
  });

  var THEME_KEY = "fonte_theme";
  function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || "dark"; }catch(e){ return "dark"; } }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t==="light" ? "light" : "dark");
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t==="light" ? "#f7f4f0" : "#141416");
  }
  var currentTheme = loadTheme();
  applyTheme(currentTheme);
  document.getElementById("themeToggle").addEventListener("click", function(){
    currentTheme = currentTheme==="light" ? "dark" : "light";
    applyTheme(currentTheme);
    try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
  });

  render();
})();
</script>
</body>
</html>
